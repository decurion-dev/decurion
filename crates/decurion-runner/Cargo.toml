[package]
name = "decurion-runner"
description = "Decurion runner: starts one sealed agent container (Claude Code or pi) per piece of work"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
# An add-on's files arrive from the hub as base64 inside JSON (addons.rs).
base64 = "0.22"
decurion-proto = { path = "../decurion-proto" }
decurion-vault = { path = "../decurion-vault" }
futures-util = "0.3"
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "sync"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
bytes = "1"
tower.workspace = true
http-body = "1"
tokio = { workspace = true, features = ["net", "sync"] }

[lints]
workspace = true
