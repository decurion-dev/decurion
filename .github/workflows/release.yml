name: release

# Builds the Windows installer and the Mac and Linux downloads, and checks that
# each one installs and starts.
#
# - Pull requests that touch packaging run everything except publishing.
# - Pushing a tag like v0.1.0 also creates a DRAFT GitHub release with the
#   files attached. Nothing becomes public until a maintainer opens the draft
#   on the Releases page and presses Publish.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        shell: bash
        run: |
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ -n "$cargo_version" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$cargo_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
              exit 1
            fi
            echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          else
            echo "version=$cargo_version-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked -p decurion-hub -p decurion-runner
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DBinDir=$PWD\target\release" "/DOutDir=$PWD\dist" packaging\windows\decurion.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the installer installs and Decurion starts
        shell: pwsh
        run: |
          $setup = "dist\Decurion-Setup-$env:VERSION-x64.exe"
          Start-Process -Wait -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$PWD\dist\install.log"
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Decurion'
          foreach ($f in 'decurion-hub.exe', 'decurion-runner.exe', 'start-decurion.ps1', 'docker\claude-worker\Dockerfile', 'LICENSE') {
            if (-not (Test-Path (Join-Path $app $f))) { Get-Content dist\install.log; throw "installer did not put $f in $app" }
          }
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Decurion.lnk'
          if (-not (Test-Path $lnk)) { throw "no Start menu shortcut at $lnk" }
          if (-not (Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Decurion - Save a Claude sign-in.lnk'))) { throw 'no sign-in shortcut' }
          # The scripts must at least parse in Windows PowerShell 5.1.
          foreach ($ps in 'start-decurion.ps1', 'save-claude-sign-in.ps1') {
            powershell -NoProfile -Command "`$null = [scriptblock]::Create((Get-Content -Raw '$app\$ps'))"
            if ($LASTEXITCODE -ne 0) { throw "$ps does not parse" }
          }
          $env:DECURION_DATA = Join-Path $env:RUNNER_TEMP 'decurion-data'
          $env:DECURION_ADDR = '127.0.0.1:0'
          $out = Join-Path $env:RUNNER_TEMP 'hub.out'
          $hub = Start-Process -PassThru -FilePath (Join-Path $app 'decurion-hub.exe') -RedirectStandardOutput $out -RedirectStandardError "$out.err"
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Milliseconds 500
            $ok = (Test-Path $out) -and ((Get-Content -Raw $out) -match 'Open the board: ')
          }
          Stop-Process -Id $hub.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$out.err"; throw 'the installed hub did not start' }
          $uninstaller = Join-Path $app 'unins000.exe'
          Start-Process -Wait -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # The uninstaller hands off to a copy of itself and returns early.
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $app 'decurion-hub.exe')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $app 'decurion-hub.exe')) { throw 'uninstall left decurion-hub.exe behind' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/Decurion-Setup-*.exe
          if-no-files-found: error

  unix:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            toolchain_targets: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
            toolchain_targets: aarch64-unknown-linux-gnu
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            toolchain_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: decurion-${{ needs.version.outputs.version }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.toolchain_targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
      - name: Build
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do
            cargo build --release --locked -p decurion-hub -p decurion-runner --target "$t"
          done
      - name: Package
        shell: bash
        run: |
          stage="dist/$NAME"
          mkdir -p "$stage/bin" "$stage/share/decurion/docker"
          for b in decurion-hub decurion-runner; do
            set -- ${{ matrix.targets }}
            if [ $# -gt 1 ]; then
              # One file that runs on both Apple Silicon and Intel Macs. Apple
              # Silicon only runs signed programs, so give it a local signature.
              lipo -create -output "$stage/bin/$b" $(for t in "$@"; do echo "target/$t/release/$b"; done)
              codesign --force --sign - "$stage/bin/$b"
            else
              cp "target/$1/release/$b" "$stage/bin/$b"
            fi
          done
          cp packaging/unix/decurion-start "$stage/bin/"
          cp packaging/unix/install.sh LICENSE README.md "$stage/"
          [ -f NOTICE ] && cp NOTICE "$stage/"
          cp -R docker/claude-worker "$stage/share/decurion/docker/"
          chmod 755 "$stage"/bin/* "$stage/install.sh"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
      - name: Check it installs and Decurion starts
        shell: bash
        run: |
          work=$(mktemp -d)
          tar -C "$work" -xzf "dist/$NAME.tar.gz"
          "$work/$NAME/install.sh" --prefix "$work/prefix"
          for b in decurion-hub decurion-runner decurion-start; do test -x "$work/prefix/bin/$b"; done
          test -f "$work/prefix/share/decurion/docker/claude-worker/Dockerfile"
          sh -n "$work/prefix/bin/decurion-start"
          export DECURION_DATA="$work/data" DECURION_ADDR=127.0.0.1:0
          "$work/prefix/bin/decurion-hub" >"$work/hub.out" 2>"$work/hub.err" &
          hub=$!
          for _ in $(seq 60); do grep -q 'Open the board: ' "$work/hub.out" && break; sleep 0.5; done
          kill "$hub" || true
          grep -q 'Open the board: ' "$work/hub.out" || { cat "$work/hub.err"; exit 1; }
          "$work/$NAME/install.sh" --prefix "$work/prefix" --uninstall
          test ! -e "$work/prefix/bin/decurion-hub"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [version, windows, unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums, release notes and winget manifests
        shell: bash
        run: |
          cd dist
          sha256sum Decurion-Setup-*.exe decurion-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          # This version's section of CHANGELOG.md, without its heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          printf '\nCheck your download against SHA256SUMS.txt. Help: https://github.com/decurion-dev/decurion/tree/main/docs/help/src\n' >> notes.md
          sha=$(sha256sum "dist/Decurion-Setup-$VERSION-x64.exe" | cut -d' ' -f1)
          mkdir -p winget
          for f in packaging/winget/*.yaml; do
            sed -e "s/\${VERSION}/$VERSION/g" -e "s/\${SHA256}/$sha/g" "$f" > "winget/$(basename "$f")"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: winget/
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--draft --verify-tag"
          # 0.x versions are early previews.
          case "$VERSION" in 0.*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags \
            --title "Decurion $VERSION" --notes-file notes.md \
            dist/Decurion-Setup-*.exe dist/decurion-*.tar.gz dist/SHA256SUMS.txt
