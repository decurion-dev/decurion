<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/ui.css">
<title>Decurion inbox</title>
<style>
  /* The phone inbox: a calm control room. Open it, see what needs you, act, leave. */
  :root { --tabbar-h: 64px; --side: 16px; }
  html { scroll-padding-top: 120px; }
  body { min-height: 100dvh; overscroll-behavior-y: none; }

  /* ---------- Top bar ---------- */
  .appbar {
    position: sticky; top: 0; z-index: 30;
    padding-top: env(safe-area-inset-top);
    background: var(--bg);
    transition: box-shadow .2s var(--ease);
  }
  .appbar.scrolled { box-shadow: 0 1px 0 var(--line); }
  .bar { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 var(--side); max-width: 640px; margin: 0 auto; }
  .bar svg { flex: none; border-radius: 7px; }
  .bar h1 { font-size: 20px; font-weight: 700; line-height: 1; white-space: nowrap; }
  .count {
    min-width: 22px; height: 22px; padding: 0 7px; border-radius: 99px;
    background: var(--surface-3); color: var(--ink);
    font: 650 12px/22px var(--font); text-align: center; font-variant-numeric: tabular-nums;
  }
  .updated { margin-left: auto; font-size: 12px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .appbar .banner { border-top: 1px solid var(--amber-line); }

  /* Board filter chips, part of the sticky top bar on the board tab. */
  .chips {
    display: flex; gap: 8px; overflow-x: auto; padding: 2px var(--side) 12px;
    max-width: 640px; margin: 0 auto; scrollbar-width: none; scroll-padding: 0 var(--side);
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
            mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 14px;
    border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: 600 14px/1 var(--font); cursor: pointer; white-space: nowrap;
    transition: background-color .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
  }
  .chip .n { color: var(--faint); font-variant-numeric: tabular-nums; }
  .chip.zero { color: var(--muted); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber-line); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .chip[aria-pressed="true"] .n { color: inherit; opacity: .72; }
  .chip:last-child { margin-right: 24px; }

  /* ---------- Content ---------- */
  .page { max-width: 640px; margin: 0 auto; padding: 4px var(--side) calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px); }
  .view { display: grid; gap: 12px; animation: fade .2s var(--ease); }
  .list { display: grid; gap: 12px; }
  body.offline .live { transition: opacity .2s var(--ease); }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Inbox cards ---------- */
  .icard {
    position: relative; display: grid; gap: 10px; padding: 14px 14px 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l);
    box-shadow: 0 1px 2px rgba(15, 18, 24, .04);
    cursor: pointer; overflow-wrap: anywhere;
    animation: rise .28s var(--ease) both;
    transition: transform .14s var(--ease), opacity .2s var(--ease), border-color .14s var(--ease);
  }
  .icard.still, .wcard.still { animation: none; }
  .icard:active:not(:has(.btn:active, .more:active)) { transform: scale(.99); }
  .icard[data-state="needs_you"] { background: var(--amber-soft); border-color: var(--amber-line); }
  .icard.leaving { opacity: 0; transform: translateX(16px); pointer-events: none; }
  .icard .meta { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; color: var(--muted); }
  .icard .meta .app { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icard .meta .when { white-space: nowrap; color: var(--faint); }
  .icard .meta .when::before { content: "·"; margin-right: 8px; }
  .icard .meta .chev { margin-left: auto; color: var(--faint); }
  .icard .h { margin: 0; font-size: inherit; }
  .icard .ttl {
    display: block; width: 100%; padding: 0; margin: 0; border: 0; background: none; text-align: left; cursor: pointer;
    font: 650 17px/1.3 var(--font-display); letter-spacing: -0.01em; color: var(--ink);
  }
  .icard .ttl:focus-visible { outline-offset: 4px; }
  .icard .means { font-size: 14px; line-height: 1.45; color: var(--muted); margin-top: -4px; }
  .said { background: var(--bg); border-radius: var(--radius); padding: 10px 12px 11px; display: grid; gap: 4px; }
  .icard[data-state="needs_you"] .said { background: var(--surface); }
  .said .lbl { font-size: 12px; font-weight: 650; color: var(--muted); }
  /* The quote is formatted (D.richText), so it is cut by height, not lines. */
  .said .q { font-size: 15px; line-height: 1.5; color: var(--ink); max-height: 7.5em; overflow: hidden; }
  .said:has(.more:not([hidden])) .q:not(.open) { -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .said .q.open { max-height: none; }
  .said .q .rich { gap: 6px; }
  .icard .asks { background: var(--bg); }
  .icard[data-state="needs_you"] .asks { background: var(--surface); }
  .iacts .pair { display: flex; flex-wrap: wrap; gap: 8px; }
  .iacts .pair .btn { flex: 1 1 auto; width: auto; }
  .said .since { font-size: 14px; line-height: 1.5; color: var(--ink); white-space: pre-wrap; }
  .more {
    justify-self: start; margin: 0 -6px -4px; padding: 6px; border: 0; background: none; cursor: pointer;
    font: 600 13px/1 var(--font); color: var(--ink); text-decoration: underline; text-underline-offset: 3px;
    text-decoration-color: var(--field-line);
  }
  .iacts { display: grid; gap: 8px; margin-top: 2px; }
  .iacts .sub { display: flex; gap: 8px; }
  .iacts .sub .btn { flex: 1 1 0; min-width: 0; }
  .iacts .btn { width: 100%; min-height: 48px; border-radius: var(--radius); font-size: 16px; }
  .icard[data-state="needs_you"] .iacts .btn:not(.primary):not(.quiet) { background: var(--surface); }
  .err-slot:empty { display: none; }
  .icard.limit { cursor: default; }
  .icard.limit .lim { font-size: 15px; line-height: 1.5; color: var(--ink); }
  /* A goal's question: the project lead's words, cut short in the script. */
  .said .gq { font-size: 15px; line-height: 1.5; color: var(--ink); }
  .said .gq-more { font-size: 13px; color: var(--muted); }
  .notice { align-items: center; }
  .read-all { display: flex; justify-content: flex-end; margin: 0 0 10px; }
  .said .lbl-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .notice svg.i { margin-top: 0; }
  .notice.bad { align-items: flex-start; }
  .notice.bad svg.i { margin-top: 2px; }

  /* ---------- Today: one row per app, what it waits on (GET /api/today) ---------- */
  .today-card { display: grid; padding: 6px 4px 6px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); }
  .today-card .th { padding: 8px 0 4px; font-size: 13px; font-weight: 650; color: var(--muted); }
  .today-card .tr { display: flex; align-items: center; gap: 10px; min-height: 52px; padding-right: 10px; }
  .today-card .tr + .tr { border-top: 1px solid var(--line); }
  .today-card .go { flex: 1; min-width: 0; display: grid; gap: 2px; padding: 6px 0; border: 0; background: none; text-align: left; cursor: pointer; color: var(--ink); font: inherit; }
  .today-card .go .nm { font: 600 15px/1.3 var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .today-card .go .ln { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .today-card .go .use { font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .today-card .tr .btn { flex: none; min-height: 40px; }
  .today-card .pill { flex: none; }
  .today-card .pill svg.i.spin { animation: none; }
  .today-card .pill.t-merge { color: var(--accent-ink); background: var(--accent-soft); }
  .today-card .more-apps { justify-self: start; margin: 2px 0 6px -6px; }
  .today-card .run-btn { padding: 0 12px; }
  /* An app's deploy card, under its row. */
  .today-card .deploy-box { padding: 2px 10px 12px 0; }
  .today-card .deploy-box + .tr { border-top: 1px solid var(--line); }
  /* A narrow phone keeps the app's name readable: Run it shows its icon only (its label stays for screen readers). */
  @media (max-width: 399px) { .today-card .run-btn .lbl { display: none; } .today-card .run-btn { width: 40px; padding: 0; } }

  /* Notifications prompt */
  .ask { padding: 12px 12px 12px 14px; border-radius: var(--radius-l); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  .ask .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink); flex: none; }
  .ask .ic svg.i { width: 16px; height: 16px; margin: 0; }
  .ask .grow { font-size: 14px; line-height: 1.4; }
  .ask .btn { margin: 0; flex: none; }

  /* ---------- Board cards ---------- */
  .wcard { padding: 14px; border-radius: var(--radius-l); }
  .wcard:active { transform: scale(.99); }
  .wcard .meta { flex-wrap: nowrap; min-width: 0; }
  .wcard .meta .tag:first-child { min-width: 0; overflow: hidden; }
  .wcard .meta .tag span { overflow: hidden; text-overflow: ellipsis; }
  .wcard .t { font-size: 16px; margin-top: 6px; }
  .wcard .says { font-size: 14px; margin-top: 4px; }
  .wcard[data-state="running"] .says { font: 13px/1.5 var(--mono); }
  .wcard .foot { margin-top: 10px; }
  .wcard .foot .acts { margin-left: auto; color: var(--faint); }
  .wcard .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--steel); animation: breathe 1.8s ease-in-out infinite; }
  .board-more { width: 100%; min-height: 48px; border-radius: var(--radius); }
  .board-clear { justify-self: end; min-height: 44px; }
  .board-cleared { color: var(--muted); font-size: 14px; text-align: center; padding: 18px 12px; border: 1px dashed var(--line); border-radius: var(--radius-l); }
  .dis-toggle { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 0 14px; border: 1px dashed var(--line); border-radius: var(--radius-l);
    background: none; color: var(--muted); font: 600 14px/1 var(--font); text-align: left; cursor: pointer; }
  .dis-toggle .grow { flex: 1; }
  .dis-toggle .n { font-variant-numeric: tabular-nums; color: var(--faint); }
  .dis-toggle svg.i { width: 16px; height: 16px; }
  .dis-toggle svg.i:last-child { transition: transform .12s var(--ease); }
  .dis-toggle[aria-expanded="true"] svg.i:last-child { transform: rotate(90deg); }
  .wcard.dismissed { opacity: .72; }
  @keyframes breathe { 50% { opacity: .3; } }
  /* Which app the board shows, like the app list on the PC's board. Scrolls with the cards. */
  .app-chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 calc(-1 * var(--side)); padding: 2px var(--side) 2px; scrollbar-width: none; }
  .app-chips::-webkit-scrollbar { display: none; }
  .app-chips .chip { height: 44px; }
  .app-chips .chip svg.i { width: 15px; height: 15px; color: var(--muted); }
  .app-chips .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
  .app-chips .chip[aria-pressed="true"] svg.i { color: inherit; }
  .app-chips .chip:last-child { margin-right: 0; }
  #view-board { padding-bottom: 72px; }

  /* ---------- New work: the button and the sheet with the shared form (compose.js) ---------- */
  .fab {
    position: fixed; z-index: 25; right: max(var(--side), env(safe-area-inset-right));
    bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);
    min-height: 56px; padding: 0 20px 0 16px; border-radius: 18px; font-size: 16px; box-shadow: var(--shadow-pop);
  }
  .fab svg.i { width: 20px; height: 20px; }
  body.signed-out .fab { display: none; }
  dialog.sheet {
    width: 100%; max-width: 100%; margin: auto 0 var(--kb, 0px);
    max-height: calc(100dvh - 24px - env(safe-area-inset-top) - var(--kb, 0px));
    border: 0; border-radius: 20px 20px 0 0; box-shadow: var(--shadow-pop);
  }
  dialog.sheet[open] { display: flex; flex-direction: column; animation: sheet-up .24s var(--ease); }
  @keyframes sheet-up { from { transform: translateY(32px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 6px 2px var(--side); }
  .sheet-head h2 { flex: 1; font-size: 19px; font-weight: 700; }
  .sheet-head .btn.icon { width: 44px; min-height: 44px; color: var(--muted); }
  .sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: env(safe-area-inset-bottom); }
  /* In the sheet, the form is one column with labels and a Start button that stays in reach. */
  .sheet .composer, .sheet .composer:focus-within { border: 0; border-radius: 0; box-shadow: none; background: none; }
  .sheet .composer form { display: flex; flex-direction: column; gap: 12px; padding-bottom: 12px; }
  .sheet .composer .bar, .sheet .composer .c-modes { display: contents; }
  .sheet .composer .c-mode, .sheet .composer .c-mode-line { flex: none; }
  .sheet .composer .bar .grow { display: none; }
  .sheet .composer label.lead { order: 1; padding: 4px var(--side) 0; margin-bottom: -6px; font-size: 14px; }
  .sheet .composer textarea.c-prompt {
    order: 2; width: calc(100% - 2 * var(--side)); margin: 0 var(--side); min-height: 112px; max-height: 40dvh;
    padding: 10px 12px; border: 1px solid var(--field-line); border-radius: var(--radius); background: var(--surface);
  }
  .sheet .composer textarea.c-prompt:focus { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
  .sheet .composer .c-field { order: 3; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin: 0 var(--side); }
  .sheet .composer .c-mode { order: 4; margin: 0 var(--side); padding: 3px; }
  .sheet .composer .c-mode .seg { min-height: 42px; font-size: 15px; }
  .sheet .composer .c-mode-line { order: 5; padding: 0 var(--side); margin-top: -4px; }
  .sheet .composer .c-field.c-direct { order: 6; }
  .sheet .composer .c-bg { order: 7; margin: 0 var(--side); min-height: 44px; font-size: 15px; color: var(--ink); }
  .sheet .composer .field-error { order: 8; padding: 0 var(--side); }
  .sheet .composer .bar select, .sheet .composer .bar input.c-title {
    width: 100%; max-width: none; min-height: 44px; font-size: 16px;
    background-color: var(--surface); border-color: var(--field-line);
  }
  .sheet .composer .bar .btn.c-start {
    order: 9; position: sticky; bottom: 0; margin: 4px var(--side) 0; min-height: 48px; font-size: 16px;
    border-radius: var(--radius); box-shadow: 0 0 0 10px var(--surface);
  }
  .sheet .composer .empty-state { padding: 20px var(--side) 28px; }
  @media (min-width: 641px) { dialog.sheet { max-width: 640px; margin: auto auto var(--kb, 0px); } }

  /* ---------- Loading, empty, error, signed out ---------- */
  .sk { cursor: default; animation: none; box-shadow: none; }
  .sk .skeleton { border-radius: 6px; }
  .calm { padding: 56px 24px 32px; gap: 12px; animation: rise .3s var(--ease) both; }
  .calm .halo {
    width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 6px;
    background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), 0 0 0 10px color-mix(in srgb, var(--surface) 45%, transparent);
    color: var(--muted);
  }
  .calm .halo svg.i { width: 30px; height: 30px; stroke-width: 1.8; }
  .calm h3 { font-size: 18px; font-weight: 650; }
  .calm p { font-size: 14px; max-width: 30ch; line-height: 1.5; }
  .calm .btn { margin-top: 6px; }
  .calm .why { font-size: 13px; color: var(--faint); margin-top: -4px; overflow-wrap: anywhere; }
  .calm .glance { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); text-decoration: none; padding: 8px 12px; border-radius: 99px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  .calm .glance svg.i { width: 14px; height: 14px; color: var(--faint); }
  .solo { min-height: calc(100dvh - 160px); display: grid; place-items: center; }
  .solo .card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); padding: 28px 22px; text-align: center; display: grid; gap: 10px; justify-items: center; }
  .solo .card .halo { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); margin-bottom: 4px; }
  .solo .card .halo svg.i { width: 26px; height: 26px; }
  .solo h2 { font-size: 18px; }
  .solo p { color: var(--muted); font-size: 15px; }

  /* ---------- Bottom tab bar ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .tabbar .tabs { display: flex; max-width: 480px; margin: 0 auto; }
  .tab {
    flex: 1; height: var(--tabbar-h); display: grid; justify-items: center; align-content: center; gap: 4px;
    color: var(--muted); text-decoration: none; font: 600 12px/1 var(--font); position: relative;
    transition: color .15s var(--ease);
  }
  .tab .ind { position: relative; width: 52px; height: 30px; border-radius: 99px; display: grid; place-items: center; transition: background-color .2s var(--ease); }
  .tab svg.i { width: 22px; height: 22px; stroke-width: 1.9; }
  .tab[aria-current="page"] { color: var(--accent-ink); }
  .tab[aria-current="page"] .ind { background: var(--accent-soft); }
  .tab:focus-visible { outline-offset: -4px; border-radius: var(--radius); }
  .tab .badge {
    position: absolute; top: -3px; left: calc(50% + 5px); min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 99px; background: var(--amber); color: var(--surface); box-shadow: 0 0 0 2px var(--surface);
    font: 700 11px/18px var(--font); text-align: center; font-variant-numeric: tabular-nums;
  }
  body.signed-out .tabbar { display: none; }

  @media (min-width: 641px) {
    .iacts { grid-template-columns: auto 1fr; justify-content: start; }
    .iacts > .btn { width: auto; min-width: 160px; }
    .iacts .sub { justify-content: flex-start; }
    .iacts .sub .btn { flex: 0 0 auto; width: auto; min-width: 120px; }
  }

  /* ---------- Settings tab: usage and Pro view above the shared settings ---------- */
  .set-top { display: grid; gap: 12px; margin-bottom: 12px; }
  .set-top .usage { padding: 14px 16px; border-radius: var(--radius-l); gap: 8px; font-size: 14px; }
  .set-top .usage .lbl { font-size: 13px; }
  .set-top .usage .num b { font-size: 18px; }
  .set-top .usage .plan, .set-top .usage .hint { font-size: 13px; }
  .pro-row { display: grid; gap: 2px; padding: 6px 16px 12px; border: 1px solid var(--line); border-radius: var(--radius-l); background: var(--surface); }
  .pro-row .switch { min-height: 44px; font-size: 15px; font-weight: 600; justify-content: flex-start; }
  .pro-row .switch .state { margin-left: auto; }

  /* ---------- Work panel: task tree and messages (same in board.html and inbox.html) ---------- */
  .work-body .part { display: contents; }
  .talk { display: grid; gap: 8px; }
  .talk .section-title { display: block; margin-bottom: 0; }
  .talk textarea { min-height: 76px; }
  .talk .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .talk .waiting { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .talk .field-error:empty { display: none; }
  .kids { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); }
  .kids li, .tree-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .kids li { padding: 8px 10px; }
  .kids li + li { border-top: 1px solid var(--line); }
  .kids .nm, .tree-row .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
  @media (max-width: 640px) { .talk .row .btn { flex: 1 1 100%; } }
</style>
</head>
<body>
<header class="appbar" id="appbar">
  <div class="bar">
    <span id="mark"></span>
    <h1 id="title">Needs you</h1>
    <span class="count" id="count" hidden></span>
    <span class="updated" id="updated" aria-live="off"></span>
  </div>
  <div class="banner" id="offline" role="status" hidden></div>
  <div class="chips" id="chips" role="group" aria-label="Show work by state" hidden></div>
</header>

<main class="page" id="page">
  <section class="view" id="view-inbox" aria-labelledby="title">
    <section class="today-card live" id="today" aria-label="Today: what each app waits on" hidden></section>
    <div class="notice ask" id="notify" hidden></div>
    <div class="err-slot" id="act-err" role="alert"></div>
    <div class="read-all" id="read-all" hidden></div>
    <div class="list live" id="inbox"></div>
  </section>
  <section class="view" id="view-board" aria-labelledby="title" hidden>
    <div class="app-chips" id="app-chips" role="group" aria-label="Show work for one app" hidden></div>
    <div class="list live" id="board"></div>
    <button type="button" class="btn primary fab live" id="new-fab"></button>
  </section>
  <!-- Settings: the same settings as the board's, drawn by settings.js. -->
  <section class="view" id="view-settings" aria-labelledby="title" hidden>
    <div class="live" id="settings"></div>
  </section>
  <section class="solo" id="signed-out" hidden>
    <div class="card" role="alert"></div>
  </section>
</main>

<!-- The bottom tabs, shared with the goals page: D.phoneTabs in ui.js. -->
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<script src="/ui.js"></script>
<script src="/files.js"></script>
<script src="/compose.js"></script>
<script src="/addons.js"></script>
<script src="/settings.js"></script>
<script src="/voice.js"></script>
<script>
"use strict";
const { el, $ } = D;
$("tabbar").replaceWith(D.phoneTabs("inbox"));

// What each state in the inbox means, in one plain line.
const MEANS = {
  needs_you: "The agent stopped to ask for something only you can decide.",
  // Its words are built from the app's rules where the card is drawn.
  in_review: "",
  // A research piece in review: it changed no code.
  research: "Research is done and changed no code. Fix what it found opens the app's master plan, where its findings wait to be built.",
  failed: "This piece of work could not finish. You can retry it.",
  // Only when it could not be sent to GitHub.
  done: "You accepted this, but it could not be sent to GitHub. It is still accepted.",
};
const CHIPS = ["running", "in_review", "needs_you", "queued", "done", "failed"];
const BOARD_EMPTY = {
  running: "Nothing is running right now.",
  in_review: "Nothing is waiting for review.",
  needs_you: "No agent needs you.",
  queued: "Nothing is waiting to start.",
  done: "Nothing is done yet.",
  failed: "Nothing has failed.",
};
const EMPTY_ICON = { running: "pc", in_review: "in_review", needs_you: "done", queued: "queued", done: "done", failed: "done" };
// Cards drawn at a time on the board tab; "Show more" adds this many again.
const BOARD_LIMIT = 40;

const S = {
  tab: "inbox", threads: null, goals: [], apps: {}, appList: [], limits: [], signIns: [], prs: [], merges: [], err: null, signedOut: false, updated: null,
  // GET /api/needs-you: the hub's one list of what waits on you (today.rs),
  // the same one the PC board and the app rows count. Null on an older hub.
  needs: null,
  chip: null, actErr: null, open: new Set(), notifyOn: false, showDismissed: false,
  // The board tab's app filter, remembered like the PC board's; how many cards it shows; whether a cloud worker exists.
  app: D.store.get("decurion.board.app") || "all", limit: BOARD_LIMIT, hasCloud: false,
};
const scrollMem = {};

// ---------- Recent agent activity, cached so a quiet card costs nothing ----------
const tails = new Map();
const tailKey = (t, n) => `${n}|${t.id}`;
const tailNow = (t, n) => tails.get(tailKey(t, n))?.ev ?? null;
async function loadTail(t, n, always = false) {
  const c = tails.get(tailKey(t, n));
  if (c && c.u === t.updated_at && !always) return;
  try { tails.set(tailKey(t, n), { u: t.updated_at, ev: await D.tail(t.id, n) }); } catch (_) { /* keep what we had */ }
}

// What you sent, or a step that got cut off, after the agent last spoke.
function sinceLines(ev) {
  const i = ev.findLastIndex((r) => r.event.kind === "finished" || r.event.kind === "message");
  return ev.slice(i + 1).map((r) => D.ownerLine(r.event)).filter(Boolean).slice(-3);
}

const byNewest = (a, b) => b.updated_at.localeCompare(a.updated_at);
// What is waiting on a decision comes first, then failures, then reviews.
const URGENCY = { needs_you: 0, failed: 1, done: 1, in_review: 2 };
// Accepted work is done, unless it could not be sent to GitHub. With the
// hub's list, exactly its work: a piece whose checker is still coming waits
// on the checker, not on you.
const needsYou = (t) => S.needs ? S.needs.work.some((w) => w.thread_id === t.id)
  : t.state === "done" ? t.github?.state === "failed" : t.state in MEANS && !D.checking(t);
// Dismissed work never waits in the inbox; it stays under Dismissed on the board tab.
const inboxItems = () => (S.threads ?? []).filter((t) => needsYou(t) && !t.dismissed_at).sort((a, b) => URGENCY[a.state] - URGENCY[b.state] || byNewest(a, b));
const counts = (list = S.threads ?? []) => {
  const c = Object.fromEntries(CHIPS.map((s) => [s, 0]));
  for (const t of list) if (t.state in c) c[t.state]++;
  return c;
};
// The app the board tab shows, or "all". Only offered with two apps or more.
const appFilter = () => (S.appList.length >= 2 && S.app !== "all" && S.apps[S.app] ? S.app : "all");
const inApp = (t) => appFilter() === "all" || String(t.app_id) === appFilter();
const boardThreads = () => (S.threads ?? []).filter((t) => inApp(t) && !t.dismissed_at);
// Dismissed work of the chosen chip, newest dismissed first. Shown only when opened.
const dismissedItems = () => (S.threads ?? []).filter((t) => inApp(t) && t.dismissed_at && t.state === chipNow())
  .sort((a, b) => b.dismissed_at.localeCompare(a.dismissed_at));
const chipNow = () => {
  if (S.chip) return S.chip;
  const c = counts(boardThreads());
  return D.ORDER.find((s) => c[s] > 0) ?? "running";
};
const boardItems = () => boardThreads().filter((t) => t.state === chipNow()).sort(byNewest);
const wantsTail = (s) => s === "running" || s === "needs_you" || s === "in_review" || s === "failed";
const boardTails = () => boardItems().slice(0, S.limit).filter((t) => wantsTail(t.state))
  .map((t) => loadTail(t, 5, t.state === "running"));

// ---------- Goals waiting on you ----------
// A goal waits on you when its project lead is not thinking and the goal is
// talking or has a plan ready. The inbox shows a card for a plan to approve
// or questions to answer. What a goal waits on comes from its view, fetched
// only for waiting goals and kept until the goal changes, so the five-second
// refresh costs little.
const waitsOnYou = (g) => !g.busy && (g.state === "talking" || g.state === "plan_ready");
const goalViews = new Map();
// A goal's updated_at only moves with its state, so a new question in a
// talking goal does not move it. A view is dropped while the project lead is
// thinking (the goal is not waiting then), and refetched now and then anyway.
const VIEW_FRESH_MS = 60000;
const viewKey = (g) => `${g.updated_at}|${g.state}|${g.stuck}`;
async function loadGoalView(g) {
  const c = goalViews.get(g.id);
  if (c && c.key === viewKey(g) && Date.now() - c.at < VIEW_FRESH_MS) return;
  try { goalViews.set(g.id, { key: viewKey(g), at: Date.now(), v: await D.api(`/goals/${g.id}`) }); } catch (_) { /* keep what we had */ }
}
// What a waiting goal needs from you: the latest plan to approve, or the
// latest questions nobody has answered yet. Null when the view can't say.
function goalWait(g) {
  const v = goalViews.get(g.id)?.v;
  if (!v?.messages) return null;
  const answered = new Set();
  let last = null, plan = null;
  for (const m of v.messages) {
    const b = m.body;
    if (b.kind === "answers") answered.add(b.to);
    if (b.kind !== "coordinator") continue;
    last = m;
    if (b.plan) plan = m;
  }
  if (g.state === "plan_ready" && plan) {
    return { kind: "plan", planId: plan.id, pieces: plan.body.plan.pieces?.length ?? 0, at: plan.at };
  }
  if (g.state === "talking" && last?.body.questions?.length && !answered.has(last.id)) {
    return { kind: "question", questions: last.body.questions, at: last.at };
  }
  return null;
}
// With the hub's list, every goal on it gets a card: a plan or questions in
// full when its view says so, else a short card that opens the goal (work
// to review, a stuck project lead, or something it said).
const goalCards = () => {
  if (!S.needs) return S.goals.filter(waitsOnYou).map((g) => ({ g, w: goalWait(g) })).filter((x) => x.w);
  return S.needs.goals.map((n) => {
    const g = S.goals.find((x) => x.id === n.goal_id);
    return g && { g, w: goalWait(g) ?? { kind: "other", why: n.why, at: g.updated_at } };
  }).filter(Boolean);
};
// Everything the inbox lists after limits and sign-ins: work as { t } and
// goals as { g, w }. A goal waits on a decision, so it sorts with Needs you,
// by when its project lead last spoke.
function inboxEntries() {
  const work = inboxItems().map((t) => ({ t, rank: URGENCY[t.state], at: t.updated_at }));
  const goals = goalCards().map((x) => ({ ...x, rank: URGENCY.needs_you, at: x.w.at > x.g.updated_at ? x.w.at : x.g.updated_at }));
  return [...work, ...goals].sort((a, b) => a.rank - b.rank || b.at.localeCompare(a.at));
}
// Goals whose Approve tap is on its way, so a rebuilt card can't send it twice.
const approving = new Set();

// ---------- Loading ----------
// The Goals tab's badge: goals waiting on you, from the hub's one list (a
// plan to approve, questions, work to review, a stuck project lead); on an
// older hub, questions to answer or a plan to approve.
function goalsBadge(list) {
  const n = S.needs ? S.needs.goals.length : list.filter(waitsOnYou).length;
  $("goals-badge").hidden = n === 0;
  $("goals-badge").textContent = n > 99 ? "99+" : n;
  $("tab-goals").setAttribute("aria-label", n ? `Goals, ${D.plural(n, "goal")} ${n === 1 ? "needs" : "need"} you` : "Goals");
}
// Goals, the badge and the views behind their cards. Never throws: if the hub
// can't say, the badge and the cards stay as they were.
async function loadGoals() {
  let list;
  try { list = await D.api("/goals"); } catch (_) { return; }
  if (!Array.isArray(list)) return;
  goalsBadge(list);
  S.goals = list;
  const waiting = list.filter(waitsOnYou), ids = new Set(waiting.map((g) => g.id));
  for (const id of goalViews.keys()) if (!ids.has(id)) goalViews.delete(id);
  for (const id of approving) if (!ids.has(id)) approving.delete(id);
  await Promise.all(waiting.map(loadGoalView));
}
// The Today card: one row per app, with the hub's own words (today.rs), the
// same as the board's strip. A row opens the Board tab for that app. Kept
// short on a phone: five rows, then "and N more".
const TODAY_ROWS = 5;
const TONES = { needs_you: ["needs_you", "needs_you"], working: ["running", "running"], reviewer: ["in_review", "in_review"],
  merge: ["t-merge", "branch"], done: ["done", "done"], quiet: ["queued", "queued"] };
let today = null, todayAll = false, todaySig = "";
// Open Run it sessions of whole apps (GET /api/previews), read with the
// Today rows on the inbox's own refresh. An app already running shows Open,
// which shows that run instead of starting it again. A run of one piece of
// work is opened from its panel, so it does not count here.
let previews = [];
async function loadToday() {
  // Older hubs have no /previews: then nothing shows as running.
  const [t, pv] = await Promise.all([D.api("/today").catch(() => null), D.api("/previews").catch(() => null)]);
  if (t) today = t; // else keep the last rows
  if (Array.isArray(pv)) previews = pv.filter((s) => s.thread_id == null && (s.state == null || s.state === "pending" || s.state === "live"));
  renderToday();
}
function runButton(r) {
  const s = previews.find((p) => p.app_id === r.app_id);
  const b = el("button", { type: "button", className: "btn run-btn", disabled: D.offline,
    "aria-label": s ? `Open ${r.name}, running on your PC` : `Run it: ${r.name}` },
    D.icon("start"), el("span", { className: "lbl" }, s ? "Open" : "Run it"));
  b.onclick = () => D.runApp({ id: r.app_id, name: r.name }, { sid: s?.id }).then(loadToday);
  return b;
}
function renderToday() {
  const box = $("today");
  const rows = Array.isArray(today) ? today : [];
  const sig = JSON.stringify([rows, todayAll, D.offline, D.pro, previews.map((s) => [s.id, s.app_id])]);
  if (sig === todaySig) return;
  todaySig = sig;
  box.hidden = !rows.length;
  const shown = todayAll ? rows : rows.slice(0, TODAY_ROWS);
  const more = rows.length - shown.length;
  box.replaceChildren(el("div", { className: "th" }, "Today"), ...shown.flatMap((r) => {
    const go = el("button", { type: "button", className: "go" },
      el("span", { className: "nm" }, r.name), el("span", { className: "ln" }, r.line),
      r.used_today ? el("span", { className: "use" }, `${D.usageWords(r.used_today)} today`) : null);
    go.onclick = () => { setAppFilter(String(r.app_id)); location.hash = "#board"; };
    const fixOn = r.open_comments > 0 ? (r.fix_thread_id ?? r.last_pr?.thread_id) : null;
    let act;
    if (fixOn != null) {
      act = el("button", { type: "button", className: "btn primary", disabled: D.offline }, D.icon("tool"), "Answer the comments");
      act.onclick = async () => {
        if (D.offline) return;
        act.disabled = true;
        try {
          await D.send(`/threads/${fixOn}/pr/fix`, {});
          D.toast("Started work that answers the comments.");
        } catch (e) {
          D.toast(e.message, "alert");
        }
        todaySig = "";
        refresh();
      };
    } else {
      const [cls, ic] = TONES[r.tone] ?? TONES.quiet;
      act = el("span", { className: `pill ${cls}` }, D.icon(ic), r.status);
    }
    const row = el("div", { className: "tr", dataset: { tone: r.tone } }, go, act, runButton(r));
    const again = () => { todaySig = ""; loadToday(); };
    if (r.deploy) return [row, D.deployBox(r.deploy, { onChange: again })];
    return r.can_deploy ? [row, D.deployCheck(r.app_id, r.name, { onChange: again })] : [row];
  }), ...(more > 0 ? [Object.assign(el("button", { type: "button", className: "btn quiet sm more-apps" }, `and ${D.plural(more, "more app")}`),
    { onclick: () => { todayAll = true; renderToday(); } })] : []));
}
let busy = false, again = false;
async function refresh() {
  if (busy) { again = true; return; }
  busy = true;
  const goalsJob = loadGoals();
  loadToday();
  try {
    // Hubs without the limits endpoint answer 404; that just means no limits.
    // Money and accounts only matter on the Settings tab. Computers also say
    // whether work can run in the cloud, which the new-work box needs.
    const forSettings = S.tab === "settings";
    const seq = D.settings.seq();
    const [apps, list, limits, signIns, workers, more, prs, needs] = await Promise.all([D.api("/apps"), D.api("/threads"), D.api("/limits").catch(() => []),
      D.api("/sign-ins").catch(() => []), D.api("/workers").catch(() => null),
      forSettings ? Promise.all([D.api("/spend"), D.api("/accounts").catch(() => null)]) : null,
      D.api("/prs").catch(() => []), D.api("/needs-you").catch(() => null)]);
    S.needs = needs && Array.isArray(needs.work) ? needs : null;
    // Pull requests with review comments waiting for a fix, and ones the
    // owner may merge from here (their app's rules allow it) with none.
    const open = (Array.isArray(prs) ? prs : []).filter((p) => p.state === "open" && !p.fixing);
    S.prs = open.filter((p) => p.open_comments > 0);
    S.merges = open.filter((p) => p.can_merge && !(p.open_comments > 0));
    // Work can run in the cloud only once a cloud worker is set up.
    if (Array.isArray(workers)) { S.hasCloud = workers.some((w) => w.place === "cloud"); D.setCloud(S.hasCloud); }
    if (more) D.settings.update({ apps, spend: more[0], accounts: more[1], workers: Array.isArray(workers) ? workers : [], seq });
    else D.settings.update({ apps, seq });
    S.limits = Array.isArray(limits) ? limits : [];
    // Website sign-ins that stopped working or are about to.
    S.signIns = (Array.isArray(signIns) ? signIns : []).filter((x) => x.status === "expired" || x.status === "expiring")
      .sort((a, b) => (a.status === "expired" ? 0 : 1) - (b.status === "expired" ? 0 : 1) || a.id - b.id);
    D.setApps(apps);
    S.apps = Object.fromEntries(apps.map((a) => [a.id, a]));
    S.appList = apps;
    // An app that was removed is no longer a filter.
    if (S.app !== "all" && !S.apps[S.app]) setAppFilter("all");
    S.threads = list; S.err = null; S.signedOut = false; S.updated = new Date();
    D.setThreads(list);
    const jobs = inboxItems().map((t) => loadTail(t, 20));
    if (S.tab === "board") jobs.push(...boardTails());
    await Promise.all(jobs);
    const live = new Set(list.map((t) => String(t.id)));
    for (const k of tails.keys()) if (!live.has(k.split("|")[1])) tails.delete(k);
  } catch (e) {
    S.err = e;
    if (e.signedOut) S.signedOut = true;
  }
  await goalsJob;
  busy = false;
  render();
  if (again) { again = false; refresh(); }
}

// ---------- Drawing ----------
// Rebuilds only the cards whose content changed, so scroll position and
// taps in progress survive the five-second refresh.
function reconcile(box, items) {
  if (box.dataset.mode !== "cards") { box.replaceChildren(); box.dataset.mode = "cards"; box._cards = new Map(); }
  const first = !box._painted;
  const old = box._cards, next = new Map(), els = [];
  for (const it of items) {
    let c = old.get(it.key);
    if (!c || c.sig !== it.sig) c = { sig: it.sig, el: it.build(c ? "still" : first ? "first" : "new") };
    next.set(it.key, c); els.push(c.el);
  }
  const cur = [...box.children];
  const sameKeys = cur.length === els.length && cur.every((e, i) => e.dataset.key === els[i].dataset.key);
  if (sameKeys) cur.forEach((e, i) => { if (e !== els[i]) e.replaceWith(els[i]); });
  else box.replaceChildren(...els);
  els.forEach((e, i) => { if (e.dataset.anim === "first") e.style.animationDelay = `${Math.min(i, 6) * 40}ms`; delete e.dataset.anim; });
  box._cards = next; box._painted = true;
}
function setMode(box, mode, sig, build) {
  if (box.dataset.mode === mode && box.dataset.sig === sig) return;
  box.dataset.mode = mode; box.dataset.sig = sig; box._cards = new Map();
  box.replaceChildren(...[build()].flat());
}
// Cards that finish animating stop animating, so moving them never replays it.
document.addEventListener("animationend", (e) => { if (e.target.matches?.(".icard, .wcard")) e.target.classList.add("still"); });

const skeletonCard = (big) => el("div", { className: "icard sk", "aria-hidden": "true" },
  el("div", { className: "skeleton", style: "width:42%;height:18px" }),
  el("div", { className: "skeleton", style: "width:78%;height:20px" }),
  el("div", { className: "skeleton", style: "width:92%;height:14px" }),
  big && el("div", { className: "skeleton", style: "width:100%;height:64px;border-radius:12px" }),
  big && el("div", { className: "skeleton", style: "width:100%;height:48px;border-radius:12px" }));
const skeletons = () => [skeletonCard(true), skeletonCard(true), skeletonCard(false)];

function errorState(what) {
  const retry = el("button", { type: "button", className: "btn" }, D.icon("retry"), "Try again");
  retry.onclick = () => { retry.disabled = true; refresh(); };
  return el("div", { className: "empty-state calm" },
    el("div", { className: "halo" }, D.icon(D.offline ? "offline" : "alert")),
    el("h3", {}, `Couldn't load your ${what}.`),
    el("p", {}, D.offline ? "Your work is safe. Your phone can't reach your PC right now." : "Your work is safe."),
    !D.offline && S.err?.message && el("p", { className: "why" }, `The hub said: ${S.err.message}`),
    retry);
}

function renderShell() {
  // The count is what needs you: work, goals and pull requests, the same
  // list the PC board and the app rows count. Notices about Decurion's own
  // accounts and sign-ins show above the list but are not counted.
  const n = inboxEntries().length + S.prs.length + S.merges.length;
  document.body.classList.toggle("signed-out", S.signedOut);
  $("title").textContent = S.signedOut ? "Decurion" : TITLES[S.tab];
  $("count").hidden = !(S.tab === "inbox" && n > 0 && !S.signedOut);
  $("count").textContent = n;
  $("count").setAttribute("aria-label", D.plural(n, "item"));
  $("badge").hidden = n === 0;
  $("badge").textContent = n > 99 ? "99+" : n;
  $("tab-inbox").setAttribute("aria-label", n ? `Inbox, ${D.plural(n, "item")} need you` : "Inbox");
  for (const t of TABS) {
    const on = S.tab === t && !S.signedOut;
    if (on) $("tab-" + t).setAttribute("aria-current", "page"); else $("tab-" + t).removeAttribute("aria-current");
    $("view-" + t).hidden = !on;
  }
  $("chips").hidden = S.tab !== "board" || S.signedOut || !S.threads;
  $("new-fab").hidden = S.tab !== "board" || S.signedOut;
  $("updated").textContent = S.updated && !S.signedOut ? `Updated ${D.clock(S.updated.toISOString())}` : "";
  $("signed-out").hidden = !S.signedOut;
  $("notify").hidden = !S.notifyOn || S.signedOut;
  if (S.signedOut) {
    $("signed-out").firstElementChild.replaceChildren(
      el("div", { className: "halo" }, D.icon("phone")),
      el("h2", {}, "This phone is signed out."),
      el("p", {}, "Scan a new pairing code on the board."));
  }
}

// Questions the agent asks come first, with their answers on the card.
const ASKS_IN = new Set(["needs_you", "in_review", "failed"]);
function inboxCard(t, anim) {
  const { questions, rest, fromBlock } = D.questions(D.rawWords(tailNow(t, 20) ?? []));
  const asks = ASKS_IN.has(t.state) ? questions : [];
  const said = rest.trim();
  const open = () => D.openWork(t, refresh);
  const leave = () => { card.classList.add("leaving"); setTimeout(refresh, 180); };
  const card = el("article", { className: "icard" + (anim === "still" ? " still" : ""), dataset: { state: t.state, key: t.id, anim } });
  const ttl = el("button", { type: "button", className: "ttl" }, t.title);
  ttl.onclick = open;
  card.append(
    el("div", { className: "meta" }, D.pill(t.state),
      el("span", { className: "app" }, D.appName(t.app_id)),
      el("span", { className: "when", dataset: { at: t.updated_at } }, D.ago(t.updated_at)),
      el("span", { className: "chev" }, D.icon("right"))),
    el("h2", { className: "h" }, ttl));
  if (asks.length) card.append(D.askBox(t, asks, { onSent: leave, guessed: !fromBlock,
    onTalk: (prefill) => D.openWork(t, refresh, { talk: true, prefill }) }));
  // What Accept leads to comes from the app's rules (D.acceptWords).
  card.append(el("p", { className: "means" }, t.state === "in_review" && !t.research
    ? `Looks right? Accept keeps it. ${D.acceptWords(t.app_id)} Questions or changes? Tell the agent.`
    : MEANS[t.research && t.state === "in_review" ? "research" : t.state]));
  if (said) {
    const q = el("div", { className: "q" + (S.open.has(t.id) ? " open" : "") }, D.richText(said));

function readAllText(entries) {

  entries.forEach(({ t, g, w }, i) => {

    const on = box.querySelector('[aria-pressed="true"]');
    if (on) box.scrollTo({ left: on.offsetLeft - (box.clientWidth - on.offsetWidth) / 2, behavior: box.dataset.ready ? "smooth" : "instant" });
    box.dataset.ready = "1";
  }
}

function boardCard(t, anim) {
  const app = S.apps[t.app_id];
  const line = D.cardLine(t, tailNow(t, 5));
  const b = el("button", { type: "button", className: "wcard" + (t.dismissed_at ? " dismissed" : "") + (anim === "still" ? " still" : ""), dataset: { state: t.state, key: t.id, anim } },
    el("div", { className: "meta" },
      el("span", { className: "tag" }, D.icon("app"), el("span", {}, D.appName(t.app_id) || "Unknown app")),
      app && el("span", { className: "tag dot-sep" }, D.aiLabel(app, t))),
    el("div", { className: "t" }, t.title),
    line && el("div", { className: "says" }, line),
    t.state === "done" && t.github && el("div", { className: "says" }, D.githubText(t.github)),
    el("div", { className: "foot" },
      t.state === "running" && el("span", { className: "live-dot", "aria-hidden": "true" }),
      el("span", { dataset: { at: t.updated_at } }, D.ago(t.updated_at)),
      el("span", { className: "acts" }, D.icon("right"))));
  b.onclick = () => D.openWork(t, refresh);
  return b;
}

function renderBoard() {
  const box = $("board");
  if (!S.threads) {
    if (S.err) setMode(box, "error", `${D.offline}|${S.err.message}`, () => errorState("board"));
    else setMode(box, "loading", "", skeletons);
    return;
  }
  renderChips();
  renderAppChips();
  const sel = chipNow(), all = boardItems(), items = all.slice(0, S.limit);
  const gone = sel === "done" || sel === "failed" ? dismissedItems() : [];
  if (!items.length && !gone.length) {
    // No work at all (or none for this app): the way to start some, right here.
    const one = appFilter() !== "all" ? D.appName(+appFilter()) : "";
    const none = !boardThreads().length;
    setMode(box, "empty", `${sel}|${none}|${one}|${S.appList.length}`, () => el("div", { className: "empty-state calm" },
      el("div", { className: "halo" }, D.icon(none ? "board" : EMPTY_ICON[sel])),
      el("h3", {}, none ? (one ? `No work for ${one} yet.` : "No work yet.") : BOARD_EMPTY[sel]),
      none && el("p", {}, S.appList.length ? "Say what you want. Your project lead plans it with you, or one agent just does a small change." : "Add an app in Settings first."),
      none && newWorkButton("btn primary")));
    return;
  }
  box.querySelector(".board-more")?.remove();
  const cardItem = (t) => {
    const app = S.apps[t.app_id];
    return {
      key: String(t.id),
      sig: JSON.stringify([t.state, t.updated_at, t.title, t.github, t.dismissed_at, D.appName(t.app_id), D.aiLabel(app, t), D.cardLine(t, tailNow(t, 5))]),
      build: (anim) => boardCard(t, anim),
    };
  };
  // Done and Failed: Dismiss all on top, the dismissed ones folded below.
  const head = [];
  if ((sel === "done" || sel === "failed") && all.length >= 2) {
    head.push({ key: "clear", sig: JSON.stringify([sel, all.length, D.offline]), build: () => {
      const b = el("button", { type: "button", className: "btn quiet board-clear", dataset: { key: "clear" }, disabled: D.offline },
        D.icon("archive"), `Dismiss all ${all.length}`);
      b.onclick = async () => { b.disabled = true; if (!(await D.dismiss("threads", all, { onChanged: refresh }))) b.disabled = D.offline; };
      return b;
    } });
  } else if (!all.length) {
    head.push({ key: "cleared", sig: sel, build: () => el("p", { className: "board-cleared", dataset: { key: "cleared" } },
      "All cleared. Dismissed work is kept below.") });
  }
  const tail = [];
  if (gone.length) {
    const on = S.showDismissed;
    tail.push({ key: "dis-toggle", sig: JSON.stringify([on, gone.length]), build: () => {
      const b = el("button", { type: "button", className: "dis-toggle", dataset: { key: "dis-toggle" }, "aria-expanded": on ? "true" : "false" },
        D.icon("archive"), el("span", { className: "grow" }, on ? "Hide dismissed" : "Dismissed"), el("span", { className: "n" }, gone.length), D.icon("right"));
      b.onclick = () => { S.showDismissed = !S.showDismissed; render(); };
      return b;
    } });
    if (on) tail.push(...gone.map(cardItem));
  }
  reconcile(box, [...head, ...items.map(cardItem), ...tail]);
  const extra = all.length - items.length;
  if (extra > 0) {
    const more = el("button", { type: "button", className: "btn board-more", dataset: { key: "more" } },
      extra > BOARD_LIMIT ? `Show ${BOARD_LIMIT} more (${extra} not shown)` : `Show ${D.plural(extra, "more card", "more cards")}`);
    more.onclick = async () => {
      more.disabled = true;
      S.limit += BOARD_LIMIT;
      render();
      await Promise.all(boardTails());
      render();
    };
    const tog = box.querySelector('[data-key="dis-toggle"]');
    if (tog) tog.before(more); else box.append(more);
  }
}

// The app filter: All apps, then each app with its open work, a dot when one needs you.
function setAppFilter(v) {
  S.app = v;
  S.limit = BOARD_LIMIT;
  D.store.set("decurion.board.app", v);
}
function renderAppChips() {
  const box = $("app-chips");
  const show = S.appList.length >= 2;
  box.hidden = !show;
  if (!show) return;
  const open = {}, needs = {};
  for (const t of S.threads ?? []) {
    if (t.state !== "done" && t.state !== "failed") open[t.app_id] = (open[t.app_id] ?? 0) + 1;
    if (t.state === "needs_you") needs[t.app_id] = (needs[t.app_id] ?? 0) + 1;
  }
  const sel = appFilter();
  const sig = JSON.stringify([S.appList.map((a) => [a.id, a.name, a.first_today]), open, needs, sel]);
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  const total = Object.values(open).reduce((a, b) => a + b, 0);
  const anyNeeds = Object.values(needs).reduce((a, b) => a + b, 0);
  // A star instead of the app mark: that app goes first today (Settings).
  const chip = (key, name, n, need, ic) => {
    const first = ic === "star";
    const b = el("button", { type: "button", className: "chip" + (n ? "" : " zero"), "aria-pressed": key === sel ? "true" : "false", title: first ? `${name} goes first today` : name },
      D.icon(ic), name, need && key !== sel ? el("span", { className: "dot", "aria-hidden": "true" }) : null,
      el("span", { className: "n", "aria-label": `${n} open` }, n),
      first ? el("span", { className: "sr-only" }, ", goes first today") : null,
      need ? el("span", { className: "sr-only" }, `, ${need} ${need === 1 ? "needs" : "need"} you`) : null);
    b.onclick = async () => {
      if (key === sel) return;
      setAppFilter(key);
      S.chip = null;
      render();
      window.scrollTo({ top: 0 });
      await Promise.all(boardTails());
      render();
    };
    return b;
  };
  box.replaceChildren(chip("all", "All apps", total, anyNeeds, "board"),
    ...S.appList.map((a) => chip(String(a.id), a.name, open[a.id] ?? 0, needs[a.id] ?? 0, a.first_today ? "star" : "app")));
  const on = box.querySelector('[aria-pressed="true"]');
  if (on) box.scrollLeft = Math.max(0, on.offsetLeft - (box.clientWidth - on.offsetWidth) / 2);
}

// ---------- New work: the sheet with the shared form ----------
// Opens over any tab. The back button closes it, like the work panel. Work
// started with "Just do it" shows on the Board; a goal opens on Goals, where
// the project lead asks its questions and shows the plan to approve.
let sheet = null, composer = null;
const vv = window.visualViewport;
function fitKeyboard() {
  if (!sheet?.open || !vv) return;
  // The on-screen keyboard covers the bottom of the page; lift the sheet above it.
  const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  sheet.style.setProperty("--kb", `${kb}px`);
}
vv?.addEventListener("resize", fitKeyboard);
vv?.addEventListener("scroll", fitKeyboard);
// Leaves the sheet for one of this page's tabs, without a step in the back history.
function leaveSheetTo(hash) {
  history.replaceState(null, "", hash);
  sheet?.close();
  window.dispatchEvent(new HashChangeEvent("hashchange"));
}
function composerState() {
  return { apps: S.appList, threads: S.threads ?? [], hasCloud: S.hasCloud, filter: appFilter(), loaded: !!S.threads };
}
function ensureSheet() {
  if (sheet) return sheet;
  composer = D.composer({
    prefix: "nw-", labels: true, keyHint: false, draftKey: "decurion.inbox.draft",
    noApps: { text: "An app is a git folder on your PC. Add one in Settings, then say what you want here.", href: "#settings/apps" },
    onStarted: (t) => {
      // Show the new card: its app (or all apps), its state, at the top of the Board.
      if (t && appFilter() !== "all" && String(t.app_id) !== appFilter()) setAppFilter("all");
      if (t && S.threads && !S.threads.some((x) => x.id === t.id)) S.threads = [t, ...S.threads];
      S.chip = t?.state ?? "queued";
      S.limit = BOARD_LIMIT;
      if (S.tab === "board") { sheet.close(); render(); } else leaveSheetTo("#board");
      window.scrollTo({ top: 0 });
      refresh();
    },
    onGoal: (g) => {
      history.replaceState(null, "", location.href);
      sheet.close();
      if (g?.id != null) location.href = `/goals#goal-${g.id}`;
    },
  });
  const x = el("button", { type: "button", className: "btn icon quiet", "aria-label": "Close" }, D.icon("close"));
  sheet = el("dialog", { className: "sheet", "aria-labelledby": "nw-h" },
    el("div", { className: "sheet-head" }, el("h2", { id: "nw-h" }, "New work"), x),
    el("div", { className: "sheet-body" }, composer.el));
  x.onclick = () => sheet.close();
  document.body.append(sheet);
  sheet.addEventListener("close", () => {
    sheet.style.removeProperty("--kb");
    if (history.state?.sheet) history.back();
  });
  sheet.addEventListener("click", (e) => {
    if (e.target === sheet) { sheet.close(); return; }
    // "Add an app" goes to the Settings tab, closing the sheet on the way.
    const a = e.target.closest('a[href^="#"]');
    if (a) { e.preventDefault(); leaveSheetTo(a.getAttribute("href")); }
  });
  // A field the keyboard would cover scrolls into sight once the keyboard is up.
  sheet.addEventListener("focusin", (e) => {
    if (e.target.matches("textarea, input, select")) setTimeout(() => e.target.scrollIntoView({ block: "nearest" }), 300);
  });
  window.addEventListener("popstate", () => { if (sheet.open && !history.state?.sheet) sheet.close(); });
  return sheet;
}
function openSheet(fill) {
  ensureSheet();
  composer.update(composerState());
  if (fill) composer.fill(fill);
  if (!sheet.open) {
    if (!history.state?.sheet) history.pushState({ sheet: true }, "");
    sheet.showModal();
    fitKeyboard();
  }
  composer.focus();
}
// Other screens (such as "Fix what it found" on finished work) open the same box, filled in.
D.setNewWork((fill) => openSheet(fill));
const newWorkButton = (cls) => {
  const b = el("button", { type: "button", className: cls }, D.icon("plus"), "New work");
  b.onclick = () => openSheet();
  return b;
};
$("new-fab").append(D.icon("plus"), "New work");
$("new-fab").onclick = () => openSheet();

// ---------- Settings tab ----------
// The board's own settings (settings.js), with a usage summary and the Pro
// view switch on top, since the phone has no sidebar or top bar for them.
function renderSettings() {
  const box = $("settings");
  if (!box.dataset.mode) {
    box.dataset.mode = "settings";
    const use = el("a", { className: "usage", id: "set-usage", href: "#settings/accounts", hidden: true, "aria-label": "Usage this month. Open accounts." });
    const pro = D.switchEl("Pro view", () => D.pro, (v) => D.setPro(v), (paint) => D.onPro(paint));
    const host = el("div");
    box.replaceChildren(host);
    // Above the list of settings tabs, not inside each one.
    const top = el("div", { className: "set-top" }, use,
      el("div", { className: "pro-row" }, pro,
        el("span", { className: "hint" }, D.PRO_LINE)));
    D.settings.mount(host, { refresh: () => refresh(), onSignedOut: () => { S.signedOut = true; render(); }, place: "phone", top });
  }
  D.settings.usage($("set-usage"));
}
// Opens the settings view: the list of its tabs, or one tab such as
// #settings/accounts, at its top.
function showSettings() {
  renderSettings();
  D.settings.show(location.hash.split("/").slice(1).join("/"));
  window.scrollTo(0, 0);
}

function render() {
  renderShell();
  if (sheet?.open) composer.update(composerState());
  if (!S.signedOut) {
    if (S.tab === "inbox") renderInbox(); else if (S.tab === "board") renderBoard(); else renderSettings();
  }
  for (const e of document.querySelectorAll("[data-at]")) e.textContent = D.ago(e.dataset.at);
}

// ---------- Tabs: #inbox, #board and #settings, so the back button works ----------
// Goals is its own page (/goals); its tab is a plain link.
const TABS = ["inbox", "board", "settings"];
const TITLES = { inbox: "Needs you", board: "Board", settings: "Settings" };
const routeOf = (h) => (h === "#board" ? "board" : h.startsWith("#settings") ? "settings"
  : h === "" || h === "#" || h === "#inbox" ? "inbox" : null);
function setTab(tab) {
  if (tab === S.tab) return;
  scrollMem[S.tab] = window.scrollY;
  S.tab = tab;
  render();
  window.scrollTo(0, scrollMem[tab] ?? 0);
  if (tab === "board" && S.threads) Promise.all(boardTails()).then(render);
  if (tab === "settings") { if (!S.signedOut) showSettings(); refresh(); } else D.settings.hide();
}
window.addEventListener("hashchange", () => {
  const r = routeOf(location.hash);
  if (!r) return;
  if (r === "settings" && S.tab === "settings") { if (!S.signedOut) showSettings(); return; }
  setTab(r);
});
for (const t of TABS) {
  $("tab-" + t).addEventListener("click", (e) => {
    if (S.tab !== t) return;
    // Inside one settings tab, the Settings tab goes back to their list.
    if (t === "settings" && location.hash !== "#settings") return;
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}
$("mark").replaceWith(D.mark(26));
if (location.hash.startsWith("#work-")) history.replaceState(null, "", location.pathname);
S.tab = routeOf(location.hash) ?? "inbox";

const topBar = $("appbar");
window.addEventListener("scroll", () => topBar.classList.toggle("scrolled", window.scrollY > 2), { passive: true });

// ---------- Offline ----------
$("offline").append(D.icon("offline"), el("span", {}, "Can't reach your PC. Answer when it's back."));
D.onOffline((off) => { $("offline").hidden = !off; render(); });

// ---------- Notifications ----------
function b64ToBytes(b64) {
  const s = atob(b64.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((b64.length + 3) % 4));
  return Uint8Array.from(s, (c) => c.charCodeAt(0));
}
// True when a subscription was made with this hub's current key. One made
// with an older key is refused by the push service on every message.
function sameKey(have, want) {
  if (!have) return false;
  const a = new Uint8Array(have);
  return a.length === want.length && a.every((b, i) => b === want[i]);
}
async function setUpNotifications() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !window.isSecureContext) return;
  const reg = await navigator.serviceWorker.register("/sw.js");
  async function subscribe() {
    const { key } = await D.api("/push/key");
    const want = b64ToBytes(key);
    let existing = await reg.pushManager.getSubscription();
    // A browser that does not say which key it used (no `options`) keeps its
    // subscription: replacing it on every visit would only churn.
    const used = existing?.options?.applicationServerKey;
    if (existing && used !== undefined && !sameKey(used, want)) {
      await existing.unsubscribe();
      existing = null;
    }
    const sub = existing ?? await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: want });
    const j = sub.toJSON();
    await D.api("/push/subscribe", { method: "POST", body: JSON.stringify({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }) });
  }
  // A phone app brought back from the background does not reload the page,
  // so check the subscription again each time the inbox comes into view.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Notification.permission === "granted") subscribe().catch(() => {});
  });
  if (Notification.permission === "granted") { await subscribe(); return; }
  if (Notification.permission === "denied") return;
  const box = $("notify");
  const text = el("span", { className: "grow" }, "Get a notification when an agent needs you.");
  const btn = el("button", { type: "button", className: "btn primary sm" }, "Turn on");
  box.replaceChildren(el("span", { className: "ic" }, D.icon("bell")), text, btn);
  btn.onclick = async () => {
    btn.disabled = true;
    try {
      if (await Notification.requestPermission() === "granted") {
        await subscribe();
        S.notifyOn = false; render();
        D.toast("Notifications are on. We'll let you know when an agent needs you.", "bell");
      } else if (Notification.permission === "denied") { S.notifyOn = false; render(); }
      else btn.disabled = false;
    } catch (e) {
      box.classList.add("bad");
      text.textContent = `Couldn't turn on notifications. ${e.message}`;
      btn.textContent = "Try again";
      btn.disabled = false;
    }
  };
  S.notifyOn = true;
  render();
}
setUpNotifications().catch(() => { /* notifications are optional; the inbox still works */ });

render();
if (S.tab === "settings" && !S.signedOut) showSettings();
refresh();
setInterval(() => { if (!document.hidden) { refresh(); D.settings.tick(); } }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
