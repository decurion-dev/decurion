# A working add-on for Decurion's add-on system, version 1 (tools only).
# It gives agents one tool, count_words, and needs no website and no key.
# See docs/addons/README.md for every field.

decurion_api = "1"

[addon]
id = "decurion.word-count"
name = "Word count"
version = "0.1.0"
description = "Lets agents count the words in a piece of text. A small example to copy."
authors = ["Decurion maintainers"]
license = "Apache-2.0"
homepage = "https://github.com/decurion-dev/decurion"

[[tool]]
# Agents see it as mcp__words__count_words.
name = "words"
summary = "Count the words in a piece of text"
# Runs in its own sealed box, from this folder (mounted at /addon). The
# program is one the box has (node); the file after it is this add-on's.
command = ["node", "server.mjs"]
# "read": it only looks things up. "write": it changes things somewhere.
effect = "read"

# This tool talks to no website. One that does lists them here; they are
# added to the run's gate for runs of apps that use the add-on:
# [tool.permissions]
# network = ["api.example.com"]

# One of the app's test keys, by name, if the tool needs one. The tool box
# reads it from the variable on the left:
# [tool.secrets]
# EXAMPLE_TOKEN = "EXAMPLE_TOKEN"
