name: Feature request
description: Suggest an idea or an improvement for Decurion.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Telling us about the problem you want solved is more useful than a specific solution, so start there.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What are you trying to do, and what gets in the way today?
      placeholder: When I ... I have to ... which is slow because ...
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
      description: How you picture it working. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have tried or considered instead? (optional)
  - type: checkboxes
    id: help
    attributes:
      label: Want to help build it?
      options:
        - label: I would like to work on this myself
