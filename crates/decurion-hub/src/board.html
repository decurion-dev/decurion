<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decurion</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/menu.css">
<style>
  /* ---------- Shell: sidebar and main area ---------- */
  .shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100dvh; }
  .side {
    position: sticky; top: 0; height: 100dvh; overflow: auto;
    display: flex; flex-direction: column; gap: 22px;
    padding: 16px 12px 14px; border-right: 1px solid var(--line);
  }
  /* The logo and the page links are the shared PC menu (D.pcNav, menu.css). */
  .ghost { display: inline-grid; place-items: center; width: 26px; height: 26px; border: 0; border-radius: 6px; background: none; color: var(--faint); cursor: pointer; }
  .ghost:hover { background: var(--surface-2); color: var(--ink); }

  .side .usage { margin-top: auto; }

  main.main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    min-height: 60px; padding: 12px 28px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
    border-bottom: 1px solid transparent;
  }
  .topbar.scrolled { border-bottom-color: var(--line); }
  .topbar h1 { font-size: 19px; font-weight: 650; }
  .topbar .sub { color: var(--faint); font-size: 13px; }
  #run-slot:empty { display: none; }
  .topbar .grow { flex: 1; }
  .topbar .right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .topbar .ttl { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; min-width: 0; }
  .content { padding: 4px 28px 40px; display: grid; gap: 22px; align-content: start; }

  /* The new-work form's look is shared with the phone: see ui.css (D.composer). Home's lists,
     its switch and the board by goal are shared too: see ui.css (Home). */
  #hv-goals { min-width: 0; }

  /* ---------- Board ---------- */
  .board-wrap { margin: 0 -28px; padding: 0 28px 8px; overflow-x: auto; scrollbar-width: thin; }
  .board { display: flex; gap: 12px; align-items: flex-start; }
  .board::after { content: ""; flex: 0 0 16px; }
  .col {
    flex: 1 0 200px; min-width: 0; max-width: 420px;
    background: color-mix(in srgb, var(--surface-2) 55%, transparent); border-radius: var(--radius-l);
    padding: 6px 6px 8px;
  }
  .col.folded { flex: 0 0 46px; min-width: 46px; padding: 0; background: none; }
  .col-h { display: flex; align-items: center; gap: 8px; padding: 6px 4px 10px 6px; }
  .col-h h2 { font-size: inherit; }
  .col-h .ct { font: 600 13px/1 var(--font); color: var(--muted); font-variant-numeric: tabular-nums; }
  .col-h .grow { flex: 1; }
  .col-h .pill:not(.needs_you) { background: none; padding-left: 2px; }
  .col-h .pill:not(.needs_you):not(.failed):not(.done) { color: var(--ink); }
  .col-h .pill.done, .col-h .pill.failed { background: none; padding-left: 2px; }
  .cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; container-type: inline-size; }
  @container (max-width: 300px) {
    .wcard .meta .tag.app svg.i { display: none; }
    .wcard .meta .tag.ai::before { content: ""; margin: 0 2px; }
  }
  .col-also { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--radius); background: var(--amber-soft); color: var(--ink); font-size: 13.5px; text-decoration: none; box-shadow: inset 0 0 0 1px var(--amber-line); }
  a.col-also:hover { text-decoration: underline; }
  .col-also .grow { flex: 1; min-width: 0; }
  /* A goal that waits on you, with its road (D.journey) and its one button. */
  .col-goal { display: grid; gap: 6px; padding: 10px 12px; border-radius: var(--radius); background: var(--amber-soft); box-shadow: inset 0 0 0 1px var(--amber-line); font-size: 13.5px; }
  .col-goal .gt { font-weight: 600; color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
  .col-goal .gt:hover { text-decoration: underline; }
  .col-goal .gl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; color: var(--amber); font-weight: 600; }
  .col-goal .btn { justify-self: start; }
  .gs { margin-bottom: 18px; }
  .col-empty { padding: 16px 12px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--faint); font-size: 13px; text-align: center; }
  .strip {
    width: 46px; min-height: 180px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0;
    border: 1px dashed var(--line); border-radius: var(--radius-l); background: none; cursor: pointer; color: var(--muted);
    font: 600 13px/1 var(--font);
  }
  .strip:hover { background: var(--surface-2); color: var(--ink); }
  .strip .vt { writing-mode: vertical-rl; letter-spacing: .01em; }
  .strip .ct { font-variant-numeric: tabular-nums; color: var(--faint); }
  .strip[data-state="failed"] svg.i { color: var(--red); }
  .strip[data-state="queued"] svg.i { color: var(--muted); }

  /* Cards: the title is the button; it stretches over the whole card. */
  .wcard { box-shadow: 0 1px 2px rgba(15, 18, 24, 0.04); }
  .wcard:hover { box-shadow: 0 2px 10px -4px rgba(15, 18, 24, 0.18); }
  .wcard.seen { animation: none; }
  .wcard .t { font-size: 14.5px; }
  .wcard .hit { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .wcard .hit::after { content: ""; position: absolute; inset: -1px; border-radius: var(--radius); }
  .wcard .hit:focus-visible { outline: none; }
  .wcard .hit:focus-visible::after { outline: 2px solid var(--focus); outline-offset: 2px; }
  .wcard .meta { flex-wrap: nowrap; white-space: nowrap; }
  .wcard .meta .tag { min-width: 0; flex: 0 1 auto; }
  .wcard .meta .tag.app { flex-shrink: 0; max-width: 60%; }
  .wcard .meta .tag span { overflow: hidden; text-overflow: ellipsis; }
  .wcard .meta .tag.place { flex-shrink: 0; }
  .wcard .meta .when { margin-left: auto; padding-left: 8px; color: var(--faint); flex: none; }
  .wcard[data-state="needs_you"] .says { color: var(--ink); }
  .wcard .foot { min-height: 20px; margin-top: 8px; }
  .wcard .foot .acts { position: relative; z-index: 1; margin: 0 0 -4px -8px; flex-wrap: wrap; gap: 2px; }
  .wcard .foot .working { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
  .wcard .foot .working svg.i { width: 13px; height: 13px; }
  .wcard .pro { display: flex; align-items: center; gap: 5px; }
  .wcard .tree { font-size: 12px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
  .wcard .pro svg.i { width: 12px; height: 12px; }
  .sk-card { height: 104px; }

  .board-wrap.more-r { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 56px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 56px), transparent); }
  .board-wrap.more-l { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 56px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 56px), transparent); }
  .board-wrap.more-l.more-r { -webkit-mask-image: linear-gradient(to right, transparent, #000 56px, #000 calc(100% - 56px), transparent); mask-image: linear-gradient(to right, transparent, #000 56px, #000 calc(100% - 56px), transparent); }
  .col-h .ghost { opacity: 0; transition: opacity .12s var(--ease); }
  .col-tools { display: flex; justify-content: flex-end; margin: -6px 0 -2px; }
  .dis-toggle {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 0 10px; margin-top: 2px;
    border: 1px dashed var(--line); border-radius: var(--radius); background: none; cursor: pointer;
    font: 600 13px/1 var(--font); color: var(--muted); text-align: left;
  }
  .dis-toggle:hover { background: var(--surface-2); color: var(--ink); }
  .dis-toggle .grow { flex: 1; }
  .dis-toggle .ct { font-variant-numeric: tabular-nums; color: var(--faint); }
  .dis-toggle svg.i { width: 14px; height: 14px; transition: transform .12s var(--ease); }
  .dis-toggle[aria-expanded="true"] svg.i { transform: rotate(90deg); }
  .wcard.dismissed { opacity: .72; box-shadow: none; }
  .wcard.dismissed:hover, .wcard.dismissed:focus-within { opacity: 1; }
  .col:hover .col-h .ghost, .col-h .ghost:focus-visible { opacity: 1; }
  @media (hover: none) { .col-h .ghost { opacity: 1; } }
  .limits { display: grid; gap: 8px; }
  .limits .notice { flex-wrap: wrap; align-items: center; }
  .limits .notice svg.i { margin-top: 0; }
  .limits .notice .grow { min-width: 220px; }
  .limits .notice .field-error { margin-top: 2px; }
  .board-empty { border: 1px dashed var(--line); border-radius: var(--radius-l); }
  /* All finished work (#board/status/done): its way back and its heading. */
  .fin-head { display: grid; gap: 4px; margin-bottom: 14px; }
  .fin-head h2 { font-size: 17px; }
  .board:has(.board-empty)::after { display: none; }

  dialog:focus-visible { outline: none; }

  /* ---------- Signed out ---------- */
  .so { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
  .so-card { max-width: 420px; text-align: center; display: grid; justify-items: center; gap: 12px; padding: 32px 28px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); box-shadow: var(--shadow-pop); }
  .so-card h1 { font-size: 20px; }
  .so-card p { color: var(--muted); }

  /* ---------- Offline ---------- */
  body.offline .live .acts .btn, body.offline .live form .btn, body.offline .live .rows .btn, body.offline .live .rows input, body.offline .live .notice .btn, body.offline #pair { pointer-events: none; opacity: .5; }

  /* ---------- Narrow screens ---------- */
  @media (min-width: 900px) and (max-width: 1199px) {
    .shell { grid-template-columns: 216px minmax(0, 1fr); }
    .topbar, .content { padding-left: 22px; padding-right: 22px; }
    .board-wrap { margin: 0 -22px; padding: 0 22px 8px; }
  }
  @media (max-width: 899px) {
    .shell { display: block; }
    .side {
      position: sticky; top: 0; z-index: 10; height: auto; overflow: visible;
      display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 8px 12px;
      padding: 10px 16px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px);
      border-right: 0; border-bottom: 1px solid var(--line);
    }
    /* The shared menu lies flat: the logo on the left, the page links on the right. */
    .side .pcnav { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
    .side .pcnav-brand { padding: 4px 0; }
    .side .pcnav-items { display: flex; gap: 4px; }
    .usage { display: none; }
    .topbar { position: static; padding: 14px 16px 8px; background: none; backdrop-filter: none; }
    .content { padding: 4px 16px 32px; }
    .board-wrap { margin: 0; padding: 0; overflow: visible; }
    .board { flex-direction: column; align-items: stretch; }
    .board::after { display: none; }
    .col { max-width: none; min-width: 0; width: 100%; flex: none; }
    .col.folded { flex: none; width: 100%; min-width: 0; }
    .strip { width: 100%; min-height: 44px; flex-direction: row; padding: 0 14px; }
    .strip .vt { writing-mode: horizontal-tb; }
    .strip .ct { margin-left: auto; }
    .col-h .ghost svg.i { transform: rotate(90deg); }
  }
  @media (max-width: 640px) {
    .side .pcnav-brand .nm { font-size: 15px; }
    .topbar h1 { font-size: 22px; }
    #new-work { display: none; }
    .topbar .right { width: 100%; justify-content: space-between; }
    .wcard .t { font-size: 15.5px; }
  }

  /* ---------- Work panel: task tree and messages (same in board.html and inbox.html) ---------- */
  .work-body .part { display: contents; }
  .talk { display: grid; gap: 8px; }
  .talk .section-title { display: block; margin-bottom: 0; }
  .talk textarea { min-height: 76px; }
  .talk .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .talk .waiting { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .talk .field-error:empty { display: none; }
  .kids { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); }
  .kids li, .tree-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .kids li { padding: 8px 10px; }
  .kids li + li { border-top: 1px solid var(--line); }
  .kids .nm, .tree-row .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
  @media (max-width: 640px) { .talk .row .btn { flex: 1 1 100%; } }
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="side" aria-label="Decurion">
    <div id="pcnav"></div>
    <a class="usage" href="#settings/accounts" id="usage" hidden></a>
  </aside>

  <main class="main" id="main">
    <div class="banner" id="offline-banner" role="status" hidden></div>
    <header class="topbar" id="topbar">
      <div class="ttl"><h1 id="page-title">Home</h1><span id="app-slot"></span></div>
      <span id="run-slot"></span>
      <span class="grow"></span>
      <div class="right">
        <span id="view-slot"></span>
        <span id="pro-slot"></span>
        <button type="button" class="btn primary" id="new-work" title="New work (N)"></button>
      </div>
    </header>

    <!-- Home: the start box, Getting started, then Needs you, Working and Done today (or the board by goal). -->
    <div class="content" id="view-home">
      <!-- The new-work form, drawn by compose.js (D.composer), the same box everywhere. -->
      <section class="composer live" id="composer" aria-label="New work"></section>
      <!-- Getting started (D.gettingStarted in ui.js), the same card as on the phone, until all five are done or it is hidden. -->
      <div id="gs-slot"></div>
      <div id="hv-goals"></div>
      <div id="hv-board" hidden></div>
      <!-- Pro view's By status: the board's columns by state, with dismissed work and helper agents.
           #board/status/done shows only its Done and Failed lists, with or without Pro view. -->
      <div id="hv-state" hidden>
        <div class="fin-head" id="fin-head" hidden></div>
        <div id="board-note" class="board-note" hidden></div>
        <div class="board-wrap live" id="board-wrap"><div class="board" id="board" aria-label="Work by status"></div></div>
      </div>
    </div>

    <!-- Settings: drawn by settings.js, shared with the phone. -->
    <div class="content" id="view-settings" hidden></div>
  </main>
</div>
<div class="so" id="signed-out" hidden></div>

<script src="/ui.js"></script>
<script src="/files.js"></script>
<script src="/compose.js"></script>
<script src="/addons.js"></script>
<script src="/settings.js"></script>
<script src="/voice.js"></script>
<script>
"use strict";
// Home on the PC: what needs you, what is working and what finished today,
// or the board by goal (Home's switch), and Settings. The phone's Home
// (inbox.html) draws the same rows from the same rules in ui.js.
(() => {
  const { el, $, icon } = D;
  const COLS = D.ORDER; // needs you first: what you came to see
  const TAILED = new Set(["running", "needs_you", "in_review", "failed"]);
  const EMPTY_COL = {
    needs_you: "All clear. Nothing needs you.", running: "No agents working right now.", in_review: "Nothing waiting for a checker.",
    queued: "Nothing waiting.", done: "Finished work shows here.", failed: "Failed work waits under Needs you until you retry or dismiss it.",
  };

  // Settings (settings.js) keeps its own copy of spend, accounts and workers.
  let apps = [], threads = [], limits = [];
  let helpers = [];             // checkers and project leads at work or lined up (GET /api/helpers)
  let hasCloud = false;
  let previews = [];            // open Run it sessions (GET /api/previews)
  let today = null;             // each app's row (GET /api/today)
  let prs = [];                 // pull requests Decurion opened (GET /api/prs)
  let signIns = [];             // website sign-ins that stopped working or soon will (GET /api/sign-ins)
  let map = null;               // which goal each piece belongs to (D.homeMap)
  const limitErr = {};          // profile -> message from a failed "Continue on pay-per-use"
  let loaded = false, loadErr = null, busy = false, timer = 0;
  const tails = new Map();      // thread id -> { key, ev }
  const seen = new Set();       // cards already shown, so they don't animate again
  const sigs = {};
  // Which app Home shows: All apps each time Home opens. Picking one also
  // makes it the app the Apps page opens on (D.app).
  let filter = "all";
  let folds = {};
  try { folds = JSON.parse(D.store.get("decurion.board.folds") || "{}") || {}; } catch (_) { folds = {}; }

  const appById = (id) => apps.find((a) => a.id === id);
  const inFilter = (t) => filter === "all" || String(t.app_id) === filter;
  // What needs you: the hub's one list (GET /api/needs-you, today.rs), the
  // same one the phone counts. Home's Needs you tab is that list; on By
  // status, work on it sits in the Needs you column whatever its state.
  // Null on an older hub: then only work that asks you counts.
  let needs = null;
  let goals = [];               // every goal, with its road (GET /api/goals)
  const needWork = () => new Set((needs?.work ?? []).map((w) => w.thread_id));
  const colOf = (t, ids) => (t.state === "needs_you" || ids.has(t.id) ? "needs_you" : t.state);
  // Dismissed work is kept, but only shows when its column's Dismissed list is open.
  const shownThreads = () => threads.filter((t) => inFilter(t) && !t.dismissed_at);
  const dismissedThreads = () => threads.filter((t) => inFilter(t) && t.dismissed_at)
    .sort((a, b) => b.dismissed_at.localeCompare(a.dismissed_at));
  const openDismissed = new Set(); // columns whose Dismissed list is open
  const lineOf = (t) => D.cardLine(t, tails.get(t.id)?.ev);

  // ---------- Which AI, which account ----------
  const AI_NAMES = { chatgpt: "ChatGPT", grok: "Grok" };
  // The account an app's Claude work runs on.
  const claudeAcct = (app) => (!app ? "" : app.pay_per_use ? "pay-per-use" : `Max plan ${app.profile}`);
  // Who does a piece of work. Claude names its account in Pro view.
  const aiOf = (t, app, full = D.pro) => AI_NAMES[t.ai] ?? (full && app ? `Claude ${claudeAcct(app)}` : "Claude");
  // Re-renders without losing keyboard focus: focus is restored by data-key.
  function keepFocus(fn) {
    const was = document.activeElement;
    const key = was?.dataset?.key;
    let caret = null;
    try { if (was?.tagName === "INPUT" && was.selectionStart != null) caret = [was.selectionStart, was.selectionEnd]; } catch (_) { /* no caret */ }
    fn();
    if (key && document.activeElement?.dataset?.key !== key) {
      const now = document.querySelector(`[data-key="${CSS.escape(key)}"]`);
      now?.focus({ preventScroll: true });
      if (caret && now?.tagName === "INPUT") try { now.setSelectionRange(...caret); } catch (_) { /* no caret */ }
    }
  }
  function changed(name, value) {
    const s = JSON.stringify(value);
    if (sigs[name] === s) return false;
    sigs[name] = s;
    return true;
  }

  // ---------- Static pieces ----------
  $("pcnav").replaceWith(D.pcNav("board"));
  $("new-work").append(icon("plus"), "New work");
  {
    // Its one plain line: on hover, and said once each time it is switched.
    const pro = D.switchEl("Pro view", () => D.pro, (v) => { D.setPro(v); D.toast(v ? D.PRO_LINE : "Pro view is off. Screens show only what you need.", "settings"); });
    pro.title = D.PRO_LINE;
    $("pro-slot").append(pro);
  }
  $("offline-banner").append(icon("offline"), el("span", {}, "Your PC's hub isn't answering. Showing the last known work."));
  // The one place to ask for work: the project lead plans it, or "Just do it" starts one piece.
  const composer = D.composer({
    root: $("composer"), prefix: "",
    noApps: { text: "An app is a git folder on this PC. Once it's added, say what you want: your project lead plans it with you, or one agent just does a small change.", href: "#settings/apps" },
    // A job of its own shows under Working, where it now is.
    onStarted: () => { if (mode === "goals") tabs.select("working"); refresh(); },
  });
  window.addEventListener("scroll", () => $("topbar").classList.toggle("scrolled", window.scrollY > 4), { passive: true });
  // Getting started, under the start box. It reads Settings' own lists, so
  // it asks twice a minute, not on every refresh.
  const startCard = D.gettingStarted();
  $("gs-slot").replaceWith(startCard);
  startCard.tick = () => {
    if (Date.now() - (startCard.at ?? 0) < 30000) return;
    startCard.at = Date.now();
    startCard.refresh();
  };

  // Which app Home shows: All apps, or one (the top bar's picker).
  const appPick = el("select", { className: "app-pick", "aria-label": "Which app Home shows", dataset: { key: "app-pick" } });
  appPick.onchange = () => setFilter(appPick.value);
  $("app-slot").replaceWith(appPick);

  // Home's switch: Goals (the three lists) or Board (by goal); By status in Pro view.
  const homeSwitch = D.homeSwitch({ selected: D.homeView.get(), onPick: (v) => {
    D.homeView.set(v);
    const want = v === "board" ? "#board" : v === "state" ? "#board/status" : "#home";
    if (location.hash !== want) location.hash = want; else route();
  } });
  $("view-slot").replaceWith(homeSwitch.el);

  // The three lists, one at a time: Needs you opens first.
  const panels = {
    needs: el("div", { className: "hpanel" }), working: el("div", { className: "hpanel" }), done: el("div", { className: "hpanel" }),
  };
  const boxes = {
    limits: el("div", { className: "limits live", hidden: true }),
    needsApps: el("div", { className: "live" }), needs: el("div", { className: "hlist live" }),
    workApps: el("div", { className: "live" }), working: el("div", { className: "hlist live" }),
    done: el("div", { className: "hlist live" }),
  };
  panels.needs.append(boxes.limits, boxes.needsApps, boxes.needs);
  panels.working.append(boxes.workApps, boxes.working);
  panels.done.append(boxes.done);
  const cts = { needs: el("span", { className: "ct" }), working: el("span", { className: "ct" }), done: el("span", { className: "ct" }) };
  const needIcon = icon("alert", "need-i");
  needIcon.setAttribute("hidden", "");
  let tabsReady = false;
  const tabs = D.tabs([
    { id: "needs", label: [needIcon, "Needs you", cts.needs], panel: panels.needs },
    { id: "working", label: ["Working", cts.working], panel: panels.working },
    { id: "done", label: ["Done today", cts.done], panel: panels.done },
  ], { label: "Home", onPick: (id) => {
    if (!tabsReady) return;
    htab = id;
    // Each tab has its own link, so a reload or the back button opens it.
    const want = id === "needs" ? "#home" : `#home/${id}`;
    if (location.hash !== want) history.replaceState(null, "", want);
    window.scrollTo(0, Math.min(window.scrollY, $("hv-goals").offsetTop - 80));
  } });
  tabs.el.classList.add("home-tabs");
  $("hv-goals").append(tabs.el, ...Object.values(panels));
  tabsReady = true;

  // The board by goal, fed from this page's own refresh.
  const lanes = D.laneBoard($("hv-board"), { feed: true, onChanged: () => refresh() });

  // ---------- Routes: #home, #board and #settings ----------
  // #home is Home as the owner left it on this device (Goals or Board);
  // #home/working and #home/done open those tabs; #board opens the board by
  // goal and #board/status Pro view's columns. #board/status/done ("See all
  // finished work" under Done today) opens only By status's Done and Failed
  // lists, with their Dismissed work, Pro view or not. Old links (/#board,
  // a bare /) land on Home. #work-N opens a piece's panel over Home.
  let view = "home", mode = "goals", htab = "needs", routed = false, finishedOnly = false;
  function route() {
    let h = location.hash;
    // A piece's panel opens over the view already shown; on a first load
    // (a link to /#work-N) that is Home.
    if (D.workHash(h)) { if (routed) return; h = ""; }
    routed = true;
    if (h.startsWith("#settings")) view = "settings";
    else {
      view = "home";
      const pref = D.homeView.get();
      const was = finishedOnly;
      finishedOnly = h === "#board/status/done";
      // It opens at its top, below the top bar, with its way back in sight.
      if (finishedOnly && !was) requestAnimationFrame(() => window.scrollTo(0, Math.max(0, $("hv-state").getBoundingClientRect().top + window.scrollY - $("topbar").offsetHeight - 8)));
      if (finishedOnly) mode = "state";
      else if (h === "#board") mode = "board";
      else if (h === "#board/status") mode = D.pro ? "state" : "board";
      else if (h.startsWith("#home/")) { mode = "goals"; htab = h.slice(6) === "done" ? "done" : h.slice(6) === "working" ? "working" : "needs"; }
      else { mode = pref === "board" ? "board" : pref === "state" && D.pro ? "state" : "goals"; htab = "needs"; }
    }
    $("view-home").hidden = view !== "home";
    $("view-settings").hidden = view !== "settings";
    for (const a of document.querySelectorAll("[data-route]")) {
      if (a.dataset.route === (view === "home" ? "board" : view)) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    }
    $("page-title").textContent = view === "settings" ? "Settings" : "Home";
    document.title = view === "settings" ? "Settings · Decurion" : "Decurion";
    homeSwitch.pick(mode);

    $("hv-goals").hidden = mode !== "goals";
    $("hv-board").hidden = mode !== "board";
    $("hv-state").hidden = mode !== "state";
    if (mode === "goals") { tabsReady = false; tabs.select(htab); tabsReady = true; }
    if (view === "settings") {

  // ---------- Loading ----------
  async function loadTails(list) {
    const live = new Set(list.map((t) => t.id));
    for (const id of tails.keys()) if (!live.has(id)) tails.delete(id);
    await Promise.all(list.filter((t) => TAILED.has(t.state) && !t.dismissed_at).map(async (t) => {
      const key = t.state + t.updated_at;
      const c = tails.get(t.id);
      if (c && c.key === key && t.state !== "running") return;
      try { tails.set(t.id, { key, ev: await D.tail(t.id, 5) }); } catch (_) { /* keep the old line */ }
    }));
  }

  async function refresh() {
    if (busy) return;
    busy = true;
    try {
      const seq = D.settings.seq();
      const [a, th, sp, lim, wk, ac, nd, gl, td, pv, pr, si] = await Promise.all([D.api("/apps"), D.api("/threads"), D.api("/spend"),
        D.api("/limits").catch(() => []), // older hubs have no /limits
        D.api("/workers").catch(() => []),
        D.api("/accounts").catch(() => null),
        D.api("/needs-you").catch(() => null),
        D.api("/goals").catch(() => null),
        D.api("/today").catch(() => null),
        D.api("/previews").catch(() => null), // older hubs have no /previews: then nothing shows as running
        D.api("/prs").catch(() => null),
        D.api("/sign-ins").catch(() => null)]);
      needs = nd && Array.isArray(nd.work) ? nd : null;
      // The one count of what needs you, on the menu's Home too (ui.js).
      D.showNeeds(needs);
      if (Array.isArray(gl)) goals = gl;
      if (Array.isArray(td)) today = td; // else keep the last rows
      if (Array.isArray(pv)) previews = pv.filter((s) => s.state == null || s.state === "pending" || s.state === "live");
      if (Array.isArray(pr)) prs = pr;
      if (Array.isArray(si)) signIns = D.signInsDue(si);
      startCard.tick();
      // Older hubs have no /helpers: then only building agents count.
      helpers = await D.api("/helpers").catch(() => helpers);
      // Settings keeps a website list saved while this was loading, which is newer.
      D.settings.update({ apps: a, spend: sp, accounts: ac, workers: wk, seq });
      apps = a; threads = th; limits = Array.isArray(lim) ? lim : [];
      hasCloud = Array.isArray(wk) && wk.some((w) => w.place === "cloud");
      D.setApps(a);
      D.setCloud(hasCloud);
      D.setThreads(th);
      [map] = await Promise.all([D.homeMap({ threads: th, goals }), loadTails(th)]);
      loaded = true; loadErr = null;
    } catch (e) {
      if (e.signedOut) { busy = false; signedOut(); return; }
      loadErr = e;
    }
    busy = false;
    render();
  }

  function renderHome() {

  function setFilter(v, rerender = true) {

  function focusComposer() {

  // ---------- Accounts out of usage ----------
  // At the top of Needs you: the owner can move the plan's waiting work to
  // pay-per-use until it resets. Not counted: nothing else waits on it.
  function untilText(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return "later";
    return d.toDateString() === new Date().toDateString()
      ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
      : d.toLocaleString([], { weekday: "long", hour: "numeric", minute: "2-digit" });
  }
  function renderLimits() {
    if (!changed("limits", [limits, limitErr, D.offline])) return;
    const box = boxes.limits;
    box.hidden = !limits.length;
    keepFocus(() => box.replaceChildren(...limits.map((l) => {
      // After the owner's tap, the plan's work runs on pay-per-use until the
      // reset: nothing waits and there is nothing to ask.
      const text = l.pay_per_use_until
        ? `Claude Max plan ${l.profile} is out of usage. Its work is running on pay-per-use until ${untilText(l.pay_per_use_until)}, within this month's cap. Then it goes back to the Max plan.`
        : `Claude Max plan ${l.profile} is out of usage until about ${untilText(l.until)}. ` +
          (l.waiting > 0 ? `${l.waiting} waiting; they restart on their own then.` : "New work for it waits until then.");
      let btn = null;

          } catch (e) {

      return el("div", { className: l.pay_per_use_until ? "notice" : "notice warn", role: "status" },

        el("div", { className: "grow" }, text, limitErr[l.profile] ? el("div", { className: "field-error" }, limitErr[l.profile]) : null),
        btn);
    })));
  }

  // ---------- Composer ----------
  // The form itself lives in compose.js; Home only tells it what changed.
  function renderComposer() {
    composer.update({ apps, threads, hasCloud, filter, loaded });
  }

  // ---------- Home's three lists ----------
  // Needs you (the hub's one list), Working and Done today, each a list of
  // goals with their road and button, and jobs of their own with their
  // moves (ui.js draws the rows). The apps' rows sit at the top: the ones

  const pickApp = (id) => setFilter(id ?? "all");
  const emptyLine = (iconName, head, text, btn) => el("div", { className: "empty-state hempty" },
    el("div", { className: "mark" }, icon(iconName, "l")), el("h3", {}, head), text ? el("p", {}, text) : null, btn);
  function renderLists() {
    renderLimits();

    tabs.el.querySelector('[data-tab="needs"]').setAttribute("aria-label", split.needs.total ? `Needs you, ${split.needs.total}` : "Needs you, nothing");
    const prOf = (w) => prs.find((p) => p.thread_id === w.thread_id) ?? { thread_id: w.thread_id, app_id: w.app_id, title: threads.find((t) => t.id === w.thread_id)?.title, can_merge: w.why === "merge", open_comments: w.why === "comments" ? 1 : 0 };
    const goalSig = (g) => [g.id, g.title, g.journey, g.state, D.appName(g.app_id)];
    const workSig = (t) => [t.id, t.state, t.title, t.updated_at, t.check, t.github, t.road, lineOf(t), D.appName(t.app_id)];
    const base = [D.offline, filter, D.pro, minute, apps.map((a) => [a.id, a.name, a.rules?.deploy_site])];
    const needRows = rows.filter(D.todayNeeds), workRows = rows.filter((r) => !D.todayNeeds(r));
    const pv = previews.map((s) => [s.id, s.app_id, s.thread_id]);

    if (changed("needsApps", [base, needRows, pv])) {
      keepFocus(() => boxes.needsApps.replaceChildren(...[D.todayList(needRows, { title: "Apps that need you", previews, onChanged: refresh, onPick: pickApp, picked: appId })].filter(Boolean)));
    }
    const signs = signIns.filter((x) => appId == null || x.app_id == null || String(x.app_id) === appId);
    if (changed("needs", [base, signs.map((x) => [x.id, x.label, x.card, x.app_name, x.status, x.expires_at]), split.needs.goals.map(goalSig), split.needs.work.map((w) => [w.why, ...workSig(w.t)]), split.needs.prs.map((w) => [w.thread_id, w.why, prOf(w)]), showErr ? loadErr.message : ""])) {
      keepFocus(() => {

        }

      });
    }
    if (changed("workApps", [base, workRows, pv])) {
      keepFocus(() => boxes.workApps.replaceChildren(...[D.todayList(workRows, { title: needRows.length ? "Other apps" : "Your apps", previews, onChanged: refresh, onPick: pickApp, picked: appId })].filter(Boolean)));
    }
    if (changed("working", [base, split.working.goals.map(goalSig), split.working.work.map(workSig)])) {
      keepFocus(() => {
        const list = [
          ...split.working.goals.map((g) => D.goalRow(g, { onChanged: refresh })),
          ...split.working.work.map((t) => D.workRow(t, { onChanged: refresh, line: lineOf(t) })),
        ];
        if (!list.length) list.push(emptyLine("pc", "Nothing is being worked on right now.", "Say what you want above. Your project lead plans it with you, or pick Just do it for a small change."));
        boxes.working.replaceChildren(...list);
      });
    }
    const goalLinks = (g) => {

  function loadNote() {

  // ---------- The board, by goal ----------
  function renderLanes() {

  }

  // ---------- Board ----------
  // Done is history, so it starts folded; Queued and Failed fold while empty.
  // All finished work never folds: its two lists are what it is for.
  const isFolded = (st, n) => !finishedOnly && (st in folds ? folds[st] : st === "done" || ((st === "queued" || st === "failed") && n === 0));
  const FINISHED = ["done", "failed"];
  const colsNow = () => (finishedOnly ? FINISHED : COLS);
  $("fin-head").append(
    el("a", { className: "back-link", href: "#home/done" }, icon("left"), "Home"),
    el("h2", {}, "All finished work"),
    el("p", { className: "hint" }, "Everything that finished or failed, not just today's. Dismissed work is kept at the bottom of each list, where Bring back puts it back."));
  function saveFolds() { D.store.set("decurion.board.folds", JSON.stringify(folds)); }
  function toggleFold(st, n) { folds[st] = !isFolded(st, n); saveFolds(); keepFocusFold(st); }
  function keepFocusFold(st) {

  }

        el("header", { className: "col-h" }, el("h2", {}, D.pill(st))),
        el("div", { className: "cards" }, ...[0, 1].slice(0, st === "done" ? 1 : 2).map(() => el("div", { className: "skeleton sk-card" }))));
    }));
  }

  // One line each for the goals and pull requests that wait on you, at the
  // top of the Needs you column: where to go for them.
  function alsoLines(also) {
    const waits = also.filter((x) => x.goal_id != null), prs = also.filter((x) => x.goal_id == null);
    const out = [];

    // road's words and its one button.
    const roads = waits.map((w) => goals.find((g) => g.id === w.goal_id)).filter((g) => g?.journey);
    if (roads.length && roads.length === waits.length) {
      for (const g of roads) {
        const act = D.journeyButton(g.journey, D.journeyActions(g, { onChanged: refresh }), { className: "btn primary sm", key: `goal-act-${g.id}` });
        out.push(el("div", { className: "col-goal", dataset: { goal: String(g.id) } },
          el("a", { className: "gt", href: `/goals#goal-${g.id}` }, g.title),

          act));

      out.push(el("a", { className: "col-also", href: waits.length === 1 ? `/goals#goal-${waits[0].goal_id}` : "/goals" }, icon("plan"),
        el("span", { className: "grow" }, waits.length === 1 ? `A goal waits on you: ${GOAL_WAIT[waits[0].why] ?? "open it"}` : `${waits.length} goals wait on you`), icon("right")));
    }

      out.push(el("p", { className: "col-also" }, icon("branch"),
        el("span", { className: "grow" }, `${prs.length === 1 ? "A pull request waits" : `${prs.length} pull requests wait`} on you. Home's Needs you has its button.`)));
    }
    return out;
  }
  const GOAL_WAIT = { plan: "approve the plan", answer: "answer your project lead", review: "review the finished work", stuck: "your project lead got stuck" };

  function foldedCol(st, n) {
    const b = el("button", { type: "button", className: "strip", dataset: { state: st, key: `fold-${st}` }, "aria-expanded": "false",
      "aria-label": `Show ${D.STATES[st].col}${n == null ? "" : `, ${n}`}`, title: `Show ${D.STATES[st].col}` },
      icon(st === "running" && !n ? "queued" : st), el("span", { className: "vt" }, D.STATES[st].col), n == null ? null : el("span", { className: "ct" }, String(n)));
    if (b.querySelector("svg")?.classList.contains("spin") && !n) b.querySelector("svg").classList.remove("spin");
    if (n != null) b.onclick = () => toggleFold(st, n);
    return el("section", { className: "col folded", dataset: { state: st } }, b);
  }

  function card(t) {
    const app = appById(t.app_id);
    const line = lineOf(t);
    const c = el("article", { className: `wcard${seen.has(t.id) ? " seen" : ""}`, dataset: { state: t.state, id: String(t.id) } });
    seen.add(t.id);
    const hit = el("button", { type: "button", className: "hit", dataset: { key: `card-${t.id}` } }, t.title);
    hit.onclick = () => D.openWork(t, refresh);
    // No Accept, Send back or Reject while the checker looks first (D.checking).
    const acts = (t.state === "needs_you" || t.state === "in_review") && !D.checking(t)
      ? D.moveButtons(t, { quiet: true, size: "sm", onMoved: refresh }) : [];
    // Finished work with a step bar: the one tap its send needs (Open the
    // pull request, or Try again), with the card's other buttons.
    const gh = t.road && D.githubButton(t, refresh, { small: true });
    if (gh) acts.unshift(gh);
    acts.forEach((b, i) => { b.dataset.key = `act-${t.id}-${i}`; b.disabled = D.offline; });
    // Finished work can be put out of the way; dismissed work can come back.
    if (D.finished(t)) {

      const put = el("button", { type: "button", className: "btn quiet sm", dataset: { key: `dis-${t.id}` },
        title: back ? "Show it with your other work again" : "Hide it from Home. It's kept under Dismissed." },
        icon(back ? "retry" : "archive"), back ? "Bring back" : "Dismiss");
      put.disabled = D.offline;
      put.onclick = async (ev) => {
        ev.stopPropagation();
        put.disabled = true;
        if (!(await D.dismiss("threads", [t], { dismissed: !back, onChanged: refresh }))) put.disabled = D.offline;
      };
      acts.push(put);
    }
    if (t.dismissed_at) c.classList.add("dismissed");
    const parts = [
      el("div", { className: "meta" },
        el("span", { className: "tag app" }, icon("app"), el("span", {}, D.appName(t.app_id) || "Unknown app")),
        el("span", { className: "tag ai dot-sep", title: `Done by ${aiOf(t, app, true)}` }, icon("ai"), el("span", {}, aiOf(t, app))),
        hasCloud && el("span", { className: "tag place dot-sep", title: t.place === "cloud" ? "Runs in the cloud" : "Runs on your PC" },
          icon(t.place === "cloud" ? "cloud" : "pc"), el("span", {}, t.place === "cloud" ? "Cloud" : "PC")),
        el("span", { className: "when", title: `Last activity ${new Date(D.lastActivity(t)).toLocaleString()}` }, D.ago(D.lastActivity(t)))),
      el("h3", { className: "t" }, hit),
      line && el("p", { className: "says" }, line),
      D.treeLine(t) && el("p", { className: "tree" }, D.treeLine(t)),
      D.pro && el("div", { className: "pro" }, icon("branch"), `${t.branch || "no branch yet"} · #${t.id}`),
      // Where finished work is, from Built to Live or On your PC (the hub's
      // road), or on an older hub how its send went.
      t.state === "done" && (t.road ? D.roadMarks(t.road, { small: true, github: t.github }) : D.github(t, refresh, { small: true })),
      (acts.length || t.state === "running") && el("div", { className: "foot" },
        acts.length ? el("span", { className: "acts" }, ...acts) : null,
        t.state === "running" ? el("span", { className: "working" }, icon("running"), "Working") : null),
      D.checking(t) && el("div", { className: "foot" }, D.checkNote(t, { small: true })),
    ];
    c.append(...parts.filter(Boolean));
    return c;
  }

  // ---------- Helper agents: checkers and project leads ----------
  // They work for a goal, not as a piece of work of their own, but they hold
  // an agent all the same: a check that runs for twenty minutes counts in
  // Running, and one lined up counts in Queued. The hub's words (live.rs).
  const HELPER = { checker: "Checker", project_lead: "Project lead", designer: "Designer" };
  const helpersIn = (st) => helpers.filter((h) => h.state === st && inFilter(h));
  function helperCard(h) {
    const piece = h.thread_id != null ? threads.find((t) => t.id === h.thread_id) : null;
    const hit = el("button", { type: "button", className: "hit", dataset: { key: `job-${h.job_id}` } }, h.piece_title ?? h.goal_title);
    hit.onclick = () => { if (piece) D.openWork(piece, refresh); else location.href = `/goals#goal-${h.goal_id}`; };
    return el("article", { className: "wcard seen helper", dataset: { state: h.state, job: String(h.job_id) } },
      el("div", { className: "meta" },
        el("span", { className: "tag app" }, icon("app"), el("span", {}, D.appName(h.app_id) || "Unknown app")),
        el("span", { className: "tag ai dot-sep" }, icon("ai"), el("span", {}, HELPER[h.kind] ?? "Helper"))),
      el("h3", { className: "t" }, hit),
      el("p", { className: "says" }, D.jobLine(h, h.kind)),
      h.state === "running" && el("div", { className: "foot" }, el("span", { className: "working" }, icon("running"), "Working")));
  }

  function renderBoard() {
    const note = $("board-note");
    const showErr = loadErr && !D.offline;
    if (changed("note", [showErr ? loadErr.message : "", D.offline])) {
      note.hidden = !showErr;
      if (showErr) {
        const again = el("button", { type: "button", className: "btn sm" }, icon("retry"), "Try again");
        again.onclick = async () => { again.disabled = true; await refresh(); again.disabled = false; };
        note.replaceChildren(el("div", { className: "notice bad", role: "alert" }, icon("alert"),
          el("div", { className: "grow" }, el("b", {}, "Couldn't load your work. "), "Nothing was lost.", el("div", { className: "hint" }, loadErr.message)), again));
      }
    }
    if (!loaded) { if (changed("board", ["skeleton", !!loadErr])) { if (loadErr) $("board").replaceChildren(); else skeleton(); } return; }

    const shown = shownThreads(), gone = dismissedThreads(), ids = needWork();
    // Goals and pull requests that wait on you have no card here; the Needs
    // you column counts them and says where they are.
    const also = needs ? [...needs.goals, ...needs.prs].filter((x) => filter === "all" || String(x.app_id) === filter) : [];
    const sig = ["board", finishedOnly, filter, D.pro, D.offline, hasCloud, folds, [...ids], also, [...openDismissed], gone.map((t) => [t.id, t.state, t.dismissed_at, t.title, t.github, t.road]), Math.floor(Date.now() / 30000), apps.map((a) => [a.id, a.name, a.pay_per_use, a.profile]),
      shown.map((t) => [t.id, t.state, t.ai, t.place, t.updated_at, t.last_activity_at, t.check, t.title, t.branch, t.github, t.road, lineOf(t), D.treeLine(t)]),
      helpers.filter(inFilter), goals.map((g) => [g.id, g.title, g.journey])];
    if (!changed("board", sig)) return;

    keepFocus(() => {
      const board = $("board");
      if (!apps.length) { board.replaceChildren(); return; }
      if (!shown.length && !gone.length && !helpers.some(inFilter)) {
        const all = filter === "all";
        const btn = !all && Object.assign(el("button", { type: "button", className: "btn sm" }, "Show all apps"), { onclick: () => setFilter("all") });
        board.replaceChildren(el("div", { className: "empty-state board-empty", style: "flex:1" },
          el("div", { className: "mark" }, icon(all ? "board" : "app", "l")),
          el("h3", {}, all ? "Nothing running yet" : `Nothing for ${D.appName(+filter)} yet`),
          el("p", {}, all ? "Say what you want above. Your project lead plans it with you, or pick Just do it for a small change." : "Say what you want above, or look at every app."),
          btn));
        return;
      }
      board.replaceChildren(...colsNow().map((st) => {
        // All finished work lists work by its own state, even work that also waits under Needs you.
        const mine = shown.filter((t) => (finishedOnly ? t.state : colOf(t, ids)) === st);
        // Running and Queued also count the helper agents (checkers, project leads).
        const jobs = helpersIn(st);
        const extra = st === "needs_you" ? alsoLines(also) : [];
        const n = mine.length + jobs.length + (st === "needs_you" ? also.length : 0);
        if (isFolded(st, n)) return foldedCol(st, n);
        const pill = D.pill(st);
        if (st === "running" && !n) pill.querySelector("svg")?.classList.remove("spin");
        const fold = el("button", { type: "button", className: "ghost", dataset: { key: `fold-${st}` }, "aria-expanded": "true",
          "aria-label": `Fold ${D.STATES[st].col}`, title: "Fold this column" }, icon("left"));
        fold.onclick = () => toggleFold(st, n);
        // Done and Failed: Dismiss all on top, and the dismissed ones folded at the bottom.
        let clear = null, kept = [];
        if (st === "done" || st === "failed") {
          if (mine.length >= 2) {
            clear = el("button", { type: "button", className: "btn quiet sm col-clear", dataset: { key: `clear-${st}` },
              title: `Hide all ${mine.length} from Home. They're kept under Dismissed.` }, icon("archive"), "Dismiss all");
            clear.disabled = D.offline;
            clear.onclick = async () => {
              clear.disabled = true;
              if (!(await D.dismiss("threads", mine, { onChanged: refresh }))) clear.disabled = D.offline;
            };
          }
          const hid = gone.filter((t) => t.state === st);
          if (hid.length) {
            const on = openDismissed.has(st);
            const tog = el("button", { type: "button", className: "dis-toggle", "aria-expanded": on ? "true" : "false", dataset: { key: `dis-list-${st}` } },
              icon("right"), el("span", { className: "grow" }, on ? "Hide dismissed" : "Dismissed"), el("span", { className: "ct" }, String(hid.length)));
            tog.onclick = () => {
              if (on) openDismissed.delete(st); else openDismissed.add(st);
              renderBoard();
              document.querySelector(`[data-key="dis-list-${st}"]`)?.focus({ preventScroll: true });
            };
            kept = [tog, ...(on ? hid.map(card) : [])];
          }
        }
        const empty = st === "done" && kept.length ? "All cleared. Dismissed work is kept below." : EMPTY_COL[st];
        return el("section", { className: "col", dataset: { state: st }, "aria-label": `${D.STATES[st].col}, ${n}` },
          el("header", { className: "col-h" }, el("h2", {}, pill), el("span", { className: "ct" }, String(n)), el("span", { className: "grow" }), finishedOnly ? null : fold),
          el("div", { className: "cards" }, clear && el("div", { className: "col-tools" }, clear), ...extra, ...(n ? [...mine.map(card), ...jobs.map(helperCard)] : [el("div", { className: "col-empty" }, empty)]), ...kept));
      }));
    });
  }

  function edges() {
    const w = $("board-wrap");
    const scrollable = w.scrollWidth > w.clientWidth + 2;
    w.classList.toggle("more-l", scrollable && w.scrollLeft > 2);
    w.classList.toggle("more-r", scrollable && w.scrollLeft + w.clientWidth < w.scrollWidth - 2);
  }
  $("board-wrap").addEventListener("scroll", edges, { passive: true });
  window.addEventListener("resize", edges);
  new ResizeObserver(edges).observe($("board"));

  // Arrow keys move between cards: up and down in a column, left and right across columns.
  $("board").addEventListener("keydown", (e) => {
    const hit = e.target.closest?.(".hit");
    if (!hit || !["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
    const cols = [...$("board").querySelectorAll(".col:not(.folded)")].map((c) => [...c.querySelectorAll(".hit")]).filter((l) => l.length);
    const ci = cols.findIndex((l) => l.includes(hit));
    if (ci < 0) return;
    const ri = cols[ci].indexOf(hit);
    const stacked = getComputedStyle($("board")).flexDirection === "column";
    let next;
    if (e.key === "Home") next = cols[ci][0];
    else if (e.key === "End") next = cols[ci][cols[ci].length - 1];
    else if (e.key === "ArrowUp") next = cols[ci][ri - 1] ?? (stacked ? cols[ci - 1]?.at(-1) : null);
    else if (e.key === "ArrowDown") next = cols[ci][ri + 1] ?? (stacked ? cols[ci + 1]?.[0] : null);
    else {
      const nc = cols[ci + (e.key === "ArrowRight" ? 1 : -1)];
      next = nc?.[Math.min(ri, nc.length - 1)];
    }
    e.preventDefault();
    if (next) { next.focus({ preventScroll: true }); next.closest(".wcard").scrollIntoView({ block: "nearest", inline: "nearest" }); }
  });

  // ---------- Offline and Pro ----------
  D.onOffline((off) => { $("offline-banner").hidden = !off; render(); });
  // Pro view off: By status goes, so the board by goal shows instead.
  D.onPro(() => {
    if (!D.pro && mode === "state" && !finishedOnly) { D.homeView.set("board"); if (location.hash === "#board") route(); else location.hash = "#board"; return; }
    if (loaded) renderHome();
  });

  // ---------- Start ----------
  // A link to one piece of work (/#work-N, from a goal or the Roadmap)
  // opens its panel; /#work-N/answer opens it on the message box.
  const openFromHash = () => {
    const w = D.workHash();
    if (!w) return false;
    history.replaceState(null, "", location.pathname + location.search);
    (async () => { try { D.openWork(await D.api(`/threads/${w.id}`), refresh, { talk: w.answer }); } catch (_) { /* gone */ } })();
    return true;
  };
  window.addEventListener("hashchange", () => { if (D.workHash() && !history.state?.work) openFromHash(); });
  D.settings.mount($("view-settings"), { refresh: () => refresh(), onSignedOut: () => signedOut(), place: "pc" });
  skeleton();
  route();
  // After the first load, so the panel knows the app's name.
  refresh().then(openFromHash);
  timer = setInterval(() => { refresh(); D.settings.tick(); }, 3000);
})();
</script>
</body>
</html>
