<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1e1b">
<link rel="manifest" href="/manifest.webmanifest">
<title>Decurion inbox</title>
<style>
  :root { --bg:#f5f4f0; --card:#fff; --ink:#1d1c19; --muted:#6f6b61; --line:#e2dfd6;
          --accent:#3b5bdb; --ok:#2b8a3e; --warn:#c77700; --bad:#c92a2a; --radius:14px; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151513; --card:#1f1e1b; --ink:#ecebe6; --muted:#9a968b; --line:#33312c;
            --accent:#7b93f0; --ok:#59c26d; --warn:#f0a43a; --bad:#f06464; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, "Segoe UI", sans-serif;
         padding:16px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:baseline; gap:10px; margin-bottom:14px; }
  h1 { font-size:22px; margin:0; }
  .muted { color:var(--muted); font-size:13px; }
  .empty { text-align:center; padding:48px 12px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
  .card[data-state="in_review"] { border-left:4px solid var(--accent); }
  .card[data-state="needs_you"] { border-left:4px solid var(--warn); }
  .card[data-state="failed"] { border-left:4px solid var(--bad); }
  .kind { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .title { font-size:18px; font-weight:600; margin:2px 0 6px; }
  .means { margin:0 0 8px; }
  .said { font-size:14px; color:var(--muted); white-space:pre-wrap; max-height:9em; overflow:auto; margin:0 0 10px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  button { font:inherit; font-weight:600; border-radius:10px; padding:12px 16px; min-height:44px; flex:1 1 auto;
           border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); }
  .bar { display:flex; gap:8px; margin:6px 0 16px; }
  .err { color:var(--bad); margin-bottom:12px; }
  .ok { color:var(--ok); margin-bottom:12px; }
  .talk { margin-top:10px; border-top:1px solid var(--line); }
  .talk summary { padding:12px 0; min-height:44px; cursor:pointer; font-weight:600; color:var(--accent); }
  .talk textarea { display:block; width:100%; min-height:88px; font:inherit; padding:10px; border-radius:10px;
                   border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .talk .muted { margin:6px 0 8px; }
  button:focus-visible, summary:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .limit { background:var(--card); border:1px solid var(--warn); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
  .limit p { margin:0 0 10px; }
</style>
</head>
<body>
<header><h1>Needs you</h1><span class="muted" id="status"></span></header>
<div class="bar"><button id="notify" type="button" hidden>Turn on notifications</button></div>
<div id="limits"></div>
<div class="err" id="act-err" role="alert"></div>
<div class="ok" id="act-ok" role="status"></div>
<div class="err" id="err"></div>
<main id="list"></main>
<script>
const MEANS = {
  in_review: ["Ready for review", "The agent finished and saved its work. Accept it, or send it back with the agent picking up where it left off."],
  needs_you: ["Waiting on you", "The agent stopped to ask for something only you can decide."],
  failed: ["Stopped", "This piece of work could not finish. You can retry it."],
};
const ACTIONS = {
  in_review: [["done", "Accept", "primary"], ["queued", "Send back", ""], ["failed", "Reject", "danger"]],
  needs_you: [["queued", "Continue", "primary"], ["failed", "Stop", "danger"]],
  failed: [["queued", "Retry", "primary"]],
};
const TALK = [["steer", "Change course now", "primary"], ["follow_up", "Do this next", ""], ["note", "Add a note", ""]];
const VIA = { steer: "change course", follow_up: "next", note: "note" };
const drafts = {}, openBoxes = new Set(); // kept across refreshes so typing is never lost
let sending = 0;
const $ = id => document.getElementById(id);
function el(tag, attrs = {}, text = "") { const e = document.createElement(tag); Object.assign(e, attrs); e.textContent = text; return e; }
async function api(path, opts = {}) {
  let r;
  try { r = await fetch("/api" + path, { headers: { "content-type": "application/json" }, ...opts }); }
  catch { throw Object.assign(new Error("Could not reach the hub. Check the connection and try again."), { network: true }); }
  if (r.status === 401) throw new Error("This phone is signed out. Scan a new pairing code on the board.");
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}
function newReceipt() {
  if (window.crypto?.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16);
  if (window.crypto?.getRandomValues) crypto.getRandomValues(b); else b.forEach((_, i) => b[i] = Math.random() * 256);
  return Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
}
// Every tap that changes something carries a receipt. If the network drops, the same
// receipt is sent once more, so the hub never does the same thing twice.
async function send(path, body) {
  const opts = { method: "POST", body: JSON.stringify({ ...body, receipt: newReceipt() }) };
  try { return await api(path, opts); }
  catch (e) { if (!e.network) throw e; await new Promise(ok => setTimeout(ok, 1000)); return api(path, opts); }
}
function ownerLine(e) {
  if (e.kind === "owner") return `You (${VIA[e.via] ?? e.via}): ${e.text}`;
  if (e.kind === "interrupted") return `Interrupted while running ${e.name}: ${e.summary}. ${e.safe_to_redo ? "Safe to run again." : "Checking what happened before redoing it."}`;
  return null;
}
async function recent(id) {
  const ev = await api(`/threads/${id}/events?tail=20`);
  // The newest thing the agent said, whether its final summary or a message,
  // and anything you sent or that got cut off after it.
  const i = ev.findLastIndex(r => r.event.kind === "finished" || r.event.kind === "message");
  const said = i >= 0 ? (ev[i].event.summary ?? ev[i].event.text ?? "") : "";
  return { said, since: ev.slice(i + 1).map(r => ownerLine(r.event)).filter(Boolean) };
}
function talkBox(t) {
  const box = el("details", { className: "talk", open: openBoxes.has(t.id) });
  box.ontoggle = () => { if (box.open) openBoxes.add(t.id); else openBoxes.delete(t.id); };
  const ta = el("textarea", { maxLength: 4000, placeholder: "Your message to the agent", ariaLabel: `Message about ${t.title}` });
  ta.value = drafts[t.id] ?? ""; ta.oninput = () => { drafts[t.id] = ta.value; };
  const row = el("div", { className: "actions" });
  for (const [kind, label, cls] of TALK) {
    const b = el("button", { type: "button", className: cls }, label);
    b.onclick = async () => {
      $("act-err").textContent = ""; $("act-ok").textContent = "";
      const text = ta.value.trim();
      if (!text) { $("act-err").textContent = "Type a message first."; ta.focus(); return; }
      row.querySelectorAll("button").forEach(x => x.disabled = true); sending++;
      try {
        await send(`/threads/${t.id}/messages`, { kind, text });
        delete drafts[t.id]; ta.value = "";
        $("act-ok").textContent = kind === "note" ? `Note added to "${t.title}". The agent sees it the next time it works.` : `Sent. "${t.title}" went back to the agent with your message.`;
      } catch (e) { $("act-err").textContent = `"${label}" did not go through: ${e.message}`; row.querySelectorAll("button").forEach(x => x.disabled = false); }
      finally { sending--; }
      refresh();
    };
    row.append(b);
  }
  box.append(el("summary", {}, "Tell the agent something"), ta,
             el("p", { className: "muted" }, "Change course or Do this next sends the work back to the agent with your message. A note just adds information and waits for the next time it works."), row);
  return box;
}
async function showLimits() {
  const limits = await api("/limits");
  $("limits").replaceChildren(...limits.map(l => {
    const t = new Date(l.until);
    // A weekly limit can reset days from now: say the day when it is not today.
    const when = t.toDateString() === new Date().toDateString()
      ? t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
      : t.toLocaleString([], { weekday: "long", hour: "numeric", minute: "2-digit" });
    const d = el("div", { className: "limit" });
    d.append(el("div", { className: "kind" }, "Account out of usage"),
             el("p", {}, `Claude Max ${l.profile} is out until about ${when}. ${l.waiting} waiting; they restart on their own then. Or continue them now on pay-per-use, within this month's cap.`));
    const b = el("button", { type: "button", className: "primary" }, "Continue on pay-per-use");
    b.onclick = async () => { b.disabled = true; try { await api(`/limits/${l.profile}/pay-per-use`, { method: "POST" }); refresh(); } catch (e) { $("act-err").textContent = e.message; b.disabled = false; } };
    d.append(b); return d;
  }));
}
async function refresh() {
  // Don't rebuild the cards under someone typing or sending a message.
  if (sending || (document.activeElement?.tagName === "TEXTAREA" && $("list").contains(document.activeElement))) return;
  try {
    showLimits().catch(() => {});
    const [apps, threads] = await Promise.all([api("/apps"), api("/threads")]);
    const names = Object.fromEntries(apps.map(a => [a.id, a.name]));
    const mine = threads.filter(t => t.state in MEANS).sort((a, b) => b.updated_at.localeCompare(a.updated_at));
    if (!mine.length) { $("list").replaceChildren(el("div", { className: "empty" }, "Nothing needs you right now.")); }
    else {
      const cards = await Promise.all(mine.map(async t => {
        const [kind, means] = MEANS[t.state];
        const c = el("article", { className: "card" }); c.dataset.state = t.state;
        c.append(el("div", { className: "kind" }, `${kind} · ${names[t.app_id] ?? ""}`), el("div", { className: "title" }, t.title),
                 el("p", { className: "means" }, means));
        const { said, since } = await recent(t.id).catch(() => ({ said: "", since: [] }));
        if (said) c.append(el("div", { className: "kind" }, "The agent says"), el("p", { className: "said" }, said));
        if (since.length) c.append(el("div", { className: "kind" }, said ? "Since then" : "Recently"), el("p", { className: "said" }, since.join("\n")));
        const row = el("div", { className: "actions" });
        for (const [to, label, cls] of ACTIONS[t.state]) {
          const b = el("button", { type: "button", className: cls }, label);
          // Action errors stay until the next tap, so a failed Accept is never mistaken for a done one.
          b.onclick = async () => { b.disabled = true; $("act-err").textContent = ""; $("act-ok").textContent = ""; try { await send(`/threads/${t.id}/move`, { to, expect: t.state }); refresh(); } catch (e) { $("act-err").textContent = `"${label}" did not go through: ${e.message}`; b.disabled = false; } };
          row.append(b);
        }
        c.append(row, talkBox(t)); return c;
      }));
      $("list").replaceChildren(...cards);
    }
    $("status").textContent = `${mine.length} · ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
    $("err").textContent = "";
  } catch (e) { $("err").textContent = e.message; }
}
function b64ToBytes(b64) {
  const s = atob(b64.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((b64.length + 3) % 4));
  return Uint8Array.from(s, c => c.charCodeAt(0));
}
async function setUpNotifications() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !window.isSecureContext) return;
  const reg = await navigator.serviceWorker.register("/sw.js");
  const existing = await reg.pushManager.getSubscription();
  const btn = $("notify");
  async function subscribe() {
    const { key } = await api("/push/key");
    const sub = existing ?? await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
    const j = sub.toJSON();
    await api("/push/subscribe", { method: "POST", body: JSON.stringify({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }) });
  }
  if (Notification.permission === "granted") { await subscribe(); return; }
  if (Notification.permission === "denied") return;
  btn.hidden = false;
  btn.onclick = async () => {
    btn.disabled = true;
    try {
      if (await Notification.requestPermission() === "granted") { await subscribe(); btn.hidden = true; }
      else { btn.disabled = false; }
    } catch (e) { $("err").textContent = e.message; btn.disabled = false; }
  };
}
setUpNotifications().catch(e => $("err").textContent = e.message);
refresh(); setInterval(refresh, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
