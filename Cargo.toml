[workspace]
resolver = "2"
members = ["crates/decurion-proto", "crates/decurion-vault", "crates/decurion-hub", "crates/decurion-runner", "crates/decurion-gate"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/decurion-dev/decurion"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
