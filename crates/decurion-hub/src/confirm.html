<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/ui.css">
<title>{{title}}</title>
<style>
  body { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
  main { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); padding: 28px 24px 24px; max-width: 400px; width: 100%; display: grid; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 600 15px var(--font-display); color: var(--muted); }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  h1 { font-size: 22px; }
  p { color: var(--muted); }
  .btn { width: 100%; min-height: 48px; font-size: 16px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/icon.svg" alt="">Decurion</div>
  <h1>{{title}}</h1>
  <p>{{text}}</p>
  <form method="post" action="{{action}}">
    <input type="hidden" name="code" value="{{code}}">
    <button class="btn primary">{{button}}</button>
  </form>
</main>
</body>
</html>
