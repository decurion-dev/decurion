name: Bug report
description: Something in Decurion did not work the way you expected.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to tell us. A few details help us fix it faster.

        **Please do not paste tokens, API keys, passwords or login codes** anywhere in this form, including in logs. Replace them with something like `<redacted>`.

        Found a security problem? Please do not open an issue. Report it privately instead: see [SECURITY.md](https://github.com/decurion-dev/decurion/blob/main/SECURITY.md).
  - type: textarea
    id: what-you-did
    attributes:
      label: What did you do?
      description: The steps that lead to the problem, one per line if you can.
      placeholder: |
        1. Added an app on the board
        2. Added a piece of work
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened instead?
      description: Include any error message you saw. Screenshots are welcome.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Decurion version
      description: The version you installed or downloaded. If you built from source, the commit you used.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: os-details
    attributes:
      label: More about your setup (optional)
      description: For example your OS version, Docker Desktop version, or Claude Code version.
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Output from the hub or runner around the time of the problem. Remove any tokens or keys first.
      render: text
