[package]
name = "decurion-hub"
description = "Decurion hub: board state, rules and the runner API"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
reqwest.workspace = true
axum = { workspace = true, features = ["ws"] }
base64 = "0.22"
decurion-proto = { path = "../decurion-proto" }
decurion-vault = { path = "../decurion-vault" }
# Reading Word, Excel and PowerPoint files the owner attaches (context.rs):
# only plain deflate, with the pure-Rust backend; no other compression, no
# encryption, no dates.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
http-body-util = "0.1"
quick-xml = { version = "0.42", default-features = false }
portable-pty = "0.9"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Reading add-on manifests (addon_manifest.rs): parsing only, no writing.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
url = "2"
uuid.workspace = true
web-push-native = "0.5"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
base64 = "0.22"
http-body-util = "0.1"
tokio-tungstenite = "0.29"
tower.workspace = true
web-push-native = "0.5"

[lints]
workspace = true
