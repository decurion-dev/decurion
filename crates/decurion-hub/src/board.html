<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decurion</title>
<style>
  :root { --bg:#f5f4f0; --card:#fff; --ink:#1d1c19; --muted:#6f6b61; --line:#e2dfd6;
          --accent:#3b5bdb; --ok:#2b8a3e; --warn:#c77700; --bad:#c92a2a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151513; --card:#1f1e1b; --ink:#ecebe6; --muted:#9a968b; --line:#33312c;
            --accent:#7b93f0; --ok:#59c26d; --warn:#f0a43a; --bad:#f06464; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:14px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header .status { color:var(--muted); font-size:13px; margin-left:auto; }
  main { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:12px; padding:16px; }
  @media (max-width: 1000px) { main { grid-template-columns:repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 600px) { main { grid-template-columns:1fr; } }
  .col h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
  .card .app { font-size:12px; color:var(--muted); }
  .card[data-state="running"] { border-left:3px solid var(--accent); }
  .card[data-state="needs_you"] { border-left:3px solid var(--warn); }
  .card[data-state="failed"] { border-left:3px solid var(--bad); }
  .card[data-state="done"] { border-left:3px solid var(--ok); }
  form { display:flex; gap:8px; flex-wrap:wrap; padding:0 16px 16px; }
  input, select, textarea, button { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
  textarea { flex:1 1 320px; min-height:38px; }
  button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
  dialog { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:12px; width:min(720px, 94vw); }
  #log { max-height:60vh; overflow:auto; font:13px/1.4 Consolas, monospace; white-space:pre-wrap; }
  .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .err { color:var(--bad); padding:0 16px; }
  .limits { padding:0 16px; }
  .limit { display:flex; gap:12px; align-items:center; flex-wrap:wrap; border:1px solid var(--warn); border-radius:10px; padding:10px 12px; margin:0 0 10px; }
  .limit span { flex:1 1 260px; }
  .spend { font-size:13px; padding:3px 10px; border-radius:99px; background:var(--card); border:1px solid var(--line); }
  .spend.near { border-color:var(--warn); color:var(--warn); }
  .hint { color:var(--muted); font-size:13px; margin:8px 0; }
  .qr svg { background:#fff; padding:8px; border-radius:8px; margin-top:10px; }
  .qr a { display:block; font-size:12px; color:var(--muted); word-break:break-all; margin-top:6px; }
  .devices { list-style:none; padding:0; margin:10px 0 0; }
  .devices li { display:flex; gap:10px; align-items:center; padding:6px 0; border-top:1px solid var(--line); }
  .devices li span { flex:1; }
  .devices button { background:var(--card); color:var(--bad); border-color:var(--line); }
</style>
</head>
<body>
<header><h1>Decurion</h1><a href="/goals">Goals</a><span class="spend" id="spend"></span><span class="status" id="status">Loading…</span></header>
<form id="add-thread">
  <select id="app" required aria-label="App"></select>
  <input id="title" placeholder="Title" required aria-label="Title">
  <textarea id="prompt" placeholder="What should the agent do?" required aria-label="Task"></textarea>
  <button>Add work</button>
</form>
<details style="padding:0 16px 12px"><summary>Add an app</summary>
  <form id="add-app" style="padding:8px 0 0">
    <input id="app-name" placeholder="Name" required aria-label="App name">
    <input id="app-path" placeholder="C:\path\to\repo" required aria-label="Repo path">
    <select id="app-profile" aria-label="Claude account"><option>A</option><option>B</option></select>
    <label class="hint"><input type="checkbox" id="app-ppu"> Pay-per-use instead of a Max account</label>
    <button>Add app</button>
  </form>
  <ul id="apps" class="devices"></ul>
</details>
<details style="padding:0 16px 12px"><summary>Spending</summary>
  <p class="hint">Pay-per-use work stops and asks you when this month's total reaches the cap. Each run can spend at most $10 of what is left.</p>
  <form id="cap-form" style="padding:0">
    <label>Monthly cap $ <input id="cap" type="number" min="0" step="1" style="width:7em" aria-label="Monthly cap in dollars"></label>
    <button>Save</button>
  </form>
</details>
<details style="padding:0 16px 12px" id="phones"><summary>Phones and browsers</summary>
  <p class="hint">Pair your phone to get the inbox there. The code works once, for a few minutes.</p>
  <button type="button" id="pair">Pair a phone</button>
  <div id="qr" class="qr"></div>
  <ul id="devices" class="devices"></ul>
</details>
<div class="limits" id="limits"></div>
<div class="err" id="err"></div>
<main id="board"></main>
<dialog id="detail"><h3 id="d-title"></h3><div id="log"></div>
  <div class="actions" id="d-actions"></div></dialog>
<script>
const COLS = [["queued","Queued"],["running","Running"],["needs_you","Needs you"],["in_review","In review"],["done","Done"],["failed","Failed"]];
const OWNER_MOVES = { in_review:[["done","Accept"],["queued","Send back"],["failed","Reject"]],
                      needs_you:[["queued","Continue"],["failed","Stop"]], failed:[["queued","Retry"]],
                      queued:[["failed","Cancel"]] };
let apps = {};
const $ = id => document.getElementById(id);
async function api(path, opts = {}) {
  const r = await fetch("/api" + path, { headers: { "content-type": "application/json" }, ...opts });
  if (r.status === 401) throw new Error("Not signed in. Open the login link the hub printed when it started.");
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}
function el(tag, attrs = {}, text = "") { const e = document.createElement(tag); Object.assign(e, attrs); e.textContent = text; return e; }
async function refresh() {
  try {
    const [a, threads] = await Promise.all([api("/apps"), api("/threads")]);
    apps = Object.fromEntries(a.map(x => [x.id, x]));
    const sel = $("app"); const keep = sel.value; sel.replaceChildren(...a.map(x => el("option", { value: x.id }, x.name))); if (keep) sel.value = keep;
    $("board").replaceChildren(...COLS.map(([st, label]) => {
      const col = el("section", { className: "col" }); const mine = threads.filter(t => t.state === st);
      col.append(el("h2", {}, `${label} (${mine.length})`));
      for (const t of mine) {
        const c = el("div", { className: "card" }); c.dataset.state = t.state;
        c.append(el("div", { className: "app" }, apps[t.app_id]?.name ?? ""), el("div", {}, t.title));
        c.onclick = () => openThread(t); col.append(c);
      }
      return col;
    }));
    $("status").textContent = `${threads.length} pieces of work · updated ${new Date().toLocaleTimeString()}`;
    const [sp] = await Promise.all([api("/spend"), showLimits($("limits"), refresh).catch(() => {})]);
    const money = n => "$" + n.toFixed(2);
    $("spend").textContent = `Pay-per-use this month: ${money(sp.pay_per_use_usd)} of ${money(sp.cap_usd)} · Max accounts used ${money(sp.max_equivalent_usd)} worth`;
    $("spend").classList.toggle("near", sp.pay_per_use_usd >= 0.8 * sp.cap_usd);
    if (document.activeElement !== $("cap")) $("cap").value = sp.cap_usd;
    $("apps").replaceChildren(...a.map(x => {
      const li = el("li"); const span = el("span", {}, `${x.name} · ${x.pay_per_use ? "pay-per-use" : "Max account " + x.profile}`);
      const b = el("button", { type: "button" }, x.pay_per_use ? `Switch to Max ${x.profile}` : "Switch to pay-per-use");
      b.onclick = async () => { await api(`/apps/${x.id}/pay-per-use`, { method: "POST", body: JSON.stringify({ on: !x.pay_per_use }) }); refresh(); };
      li.append(span, b); return li;
    }));
    $("err").textContent = "";
  } catch (e) { $("err").textContent = e.message; }
}
async function openThread(t) {
  $("d-title").textContent = `${t.title} · ${t.state.replace("_", " ")}`;
  // Events come in pages of 500; fetch them all so the outcome is never cut off.
  let ev = [], page;
  do { page = await api(`/threads/${t.id}/events?after=${ev.length ? ev[ev.length - 1].id : 0}`); ev = ev.concat(page); }
  while (page.length === 500);
  $("log").textContent = ev.map(r => {
    const e = r.event; const time = r.at.slice(11, 19);
    if (e.kind === "started") return `${time}  Agent's box started`;
    if (e.kind === "limit_hit") return `${time}  Claude Max account ran out of usage`;
    return e.kind === "message" ? `${time}  ${e.text}` : e.kind === "tool" ? `${time}  [${e.name}] ${e.summary}` : `${time}  FINISHED ${e.ok ? "ok" : "failed"}${e.cost_usd != null ? ` ($${e.cost_usd.toFixed(2)} so far)` : ""}: ${e.summary}`;
  }).join("\n") || "No activity yet.";
  $("d-actions").replaceChildren(...(OWNER_MOVES[t.state] ?? []).map(([to, label]) => {
    const b = el("button", { type: "button" }, label);
    b.onclick = async () => { try { await api(`/threads/${t.id}/move`, { method: "POST", body: JSON.stringify({ to }) }); $("detail").close(); refresh(); } catch (e) { alert(e.message); } };
    return b;
  }), Object.assign(el("button", { type: "button" }, "Close"), { onclick: () => $("detail").close() }));
  $("detail").showModal();
}
$("add-thread").onsubmit = async e => { e.preventDefault();
  try { await api("/threads", { method: "POST", body: JSON.stringify({ app_id: +$("app").value, title: $("title").value, prompt: $("prompt").value }) });
        $("title").value = ""; $("prompt").value = ""; refresh(); } catch (x) { $("err").textContent = x.message; } };
$("add-app").onsubmit = async e => { e.preventDefault();
  try { await api("/apps", { method: "POST", body: JSON.stringify({ name: $("app-name").value, repo_path: $("app-path").value, profile: $("app-profile").value, pay_per_use: $("app-ppu").checked }) });
        e.target.reset(); refresh(); } catch (x) { $("err").textContent = x.message; } };
async function showLimits(box, after) {
  const limits = await api("/limits");
  box.replaceChildren(...limits.map(l => {
    const t = new Date(l.until);
    // A weekly limit can reset days from now: say the day when it is not today.
    const when = t.toDateString() === new Date().toDateString()
      ? t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
      : t.toLocaleString([], { weekday: "long", hour: "numeric", minute: "2-digit" });
    const d = el("div", { className: "limit" });
    d.append(el("span", {}, `Claude Max ${l.profile} is out of usage until about ${when}. ${l.waiting} waiting; they restart on their own then.`));
    const b = el("button", { type: "button" }, "Continue on pay-per-use");
    b.onclick = async () => { b.disabled = true; try { await api(`/limits/${l.profile}/pay-per-use`, { method: "POST" }); after(); } catch (e) { $("err").textContent = e.message; b.disabled = false; } };
    d.append(b); return d;
  }));
}
async function loadDevices() {
  const list = await api("/devices");
  $("devices").replaceChildren(...list.map(d => {
    const li = el("li"); li.append(el("span", {}, `${d.name}${d.has_push ? " · notifications on" : ""} · last used ${d.last_seen ? d.last_seen.slice(0, 16).replace("T", " ") : "never"}`));
    const b = el("button", { type: "button" }, "Remove");
    b.onclick = async () => { if (confirm(`Sign out "${d.name}"? It will need a new pairing code.`)) { await api(`/devices/${d.id}/remove`, { method: "POST" }); loadDevices(); } };
    li.append(b); return li;
  }));
}
$("phones").ontoggle = () => { if ($("phones").open) loadDevices().catch(e => $("err").textContent = e.message); };
$("pair").onclick = async () => {
  try {
    const p = await api("/pairing", { method: "POST" });
    // The SVG is generated by the hub itself from the pairing link.
    $("qr").innerHTML = p.qr_svg;
    $("qr").append(el("a", { href: p.url }, `Or open this on the phone (works for ${p.minutes} minutes)`));
    if (p.warning) $("qr").append(el("p", { className: "hint" }, p.warning));
    setTimeout(loadDevices, 15000);
  } catch (e) { $("err").textContent = e.message; }
};
$("cap-form").onsubmit = async e => { e.preventDefault();
  const v = $("cap").value.trim();
  if (v === "" || !(+v >= 0)) { $("err").textContent = "Enter a monthly cap in dollars."; return; }
  try { await api("/spend/cap", { method: "POST", body: JSON.stringify({ cap_usd: +v }) }); $("cap").blur(); refresh(); }
  catch (x) { $("err").textContent = x.message; } };
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
